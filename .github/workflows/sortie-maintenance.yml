name: Publish tested Sortie gameplay fixes

on:
  push:
    branches: [main]
    paths:
      - ".sortie-maintenance/ready"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and run static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 .sortie-maintenance/apply_fix.py
          node --check /tmp/sortie-game.mjs

      - name: Run local HTTP browser regression
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_bin"
          npm install --prefix .sortie-maintenance --no-package-lock --no-save playwright-core@1.54.1 >/dev/null
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sortie-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          CHROME_BIN="$chrome_bin" node .sortie-maintenance/browser_test.mjs

      - name: Commit verified game changes to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sortie-maintenance
          rm -f .github/workflows/sortie-maintenance.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Fix damage handling and add gamepad controls"
          git push origin HEAD:main
