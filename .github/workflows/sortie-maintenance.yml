name: Diagnose Sortie maintenance trigger

on:
  push:
    branches: [main]
    paths:
      - ".sortie-maintenance/ready"

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .sortie-maintenance/workflow-ran.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sortie-maintenance/workflow-ran.txt
          git commit -m "Record Sortie maintenance workflow run"
          git push origin HEAD:main
