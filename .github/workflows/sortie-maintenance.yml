name: Diagnose Sortie gameplay patch

on:
  push:
    branches: [main]
    paths:
      - ".sortie-maintenance/ready"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run patch and capture diagnostics
        shell: bash
        run: |
          set +e
          python3 .sortie-maintenance/apply_fix.py > .sortie-maintenance/diagnostic.txt 2>&1
          patch_status=$?
          echo "patch_status=$patch_status" >> .sortie-maintenance/diagnostic.txt
          if [ "$patch_status" -eq 0 ]; then
            node --check /tmp/sortie-game.mjs >> .sortie-maintenance/diagnostic.txt 2>&1
            echo "node_status=$?" >> .sortie-maintenance/diagnostic.txt
          fi
          git checkout -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sortie-maintenance/diagnostic.txt
          git commit -m "Record Sortie patch diagnostics"
          git push origin HEAD:main
