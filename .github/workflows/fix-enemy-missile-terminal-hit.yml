name: Fix enemy missile terminal-hit iteration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".enemy-missile-fix/ready"

permissions:
  contents: write

jobs:
  patch-static-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guard, validate, and publish
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          start = text.index("    function updateEnemyMissiles(dt) {")
          end = text.index("    function removeEnemyMissile(index) {", start)
          section = text[start:end]
          lines = section.splitlines()

          matches = []
          for index, line in enumerate(lines):
              if line.strip() != "applyPlayerDamage(missile.damage);":
                  continue
              if index + 2 >= len(lines):
                  continue
              if lines[index + 1].strip() != "removeEnemyMissile(i);":
                  continue
              if lines[index + 2].strip() != "continue;":
                  continue
              matches.append(index)

          if len(matches) != 1:
              raise SystemExit(f"expected one terminal-hit sequence, found {len(matches)}")

          apply_index = matches[0]
          continue_line = lines[apply_index + 2]
          indent = continue_line[:len(continue_line) - len(continue_line.lstrip())]
          lines.insert(apply_index + 2, indent + "if (gameState !== STATE_PLAYING) return;")
          patched_section = "\n".join(lines) + ("\n" if section.endswith("\n") else "")

          if patched_section.count("if (gameState !== STATE_PLAYING) return;") != 1:
              raise SystemExit("terminal-hit mission-end guard is missing or duplicated")
          if (
              "applyPlayerDamage(missile.damage);\n"
              + indent + "removeEnemyMissile(i);\n"
              + indent + "if (gameState !== STATE_PLAYING) return;\n"
              + indent + "continue;"
          ) not in patched_section:
              raise SystemExit("terminal-hit guard is not immediately after missile removal")

          text = text[:start] + patched_section + text[end:]
          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one module script, found {len(scripts)}")

          required_ids = [
              "score", "highscore", "health", "missiles", "kills", "state",
              "startBtn", "retryBtn"
          ]
          for element_id in required_ids:
              if text.count(f'id="{element_id}"') != 1:
                  raise SystemExit(f"required DOM id {element_id!r} is missing or duplicated")

          Path("/tmp/sortie-game.mjs").write_text(scripts[0], encoding="utf-8")
          path.write_text(text, encoding="utf-8")
          PY

          node --check /tmp/sortie-game.mjs
          git diff --check

          rm -f .github/workflows/fix-enemy-missile-terminal-hit.yml

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add index.html .github/workflows/fix-enemy-missile-terminal-hit.yml
          git diff --cached --check
          git commit -m "Guard enemy missile loop after mission end"
          git push origin HEAD:main
