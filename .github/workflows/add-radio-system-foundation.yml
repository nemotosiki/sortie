name: Add radio system foundation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-radio-system-foundation.yml"

permissions:
  contents: write

jobs:
  patch-static-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply radio foundation, validate, and publish
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 .radio-foundation/apply.py
          node --check /tmp/sortie-game.mjs
          git diff --check

          rm -rf .radio-foundation
          rm -f .github/workflows/add-radio-system-foundation.yml

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines())
          expected = {
              "index.html",
              ".radio-foundation/apply.py",
              ".github/workflows/add-radio-system-foundation.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected staged files: {sorted(changed)}")
          PY

          git commit -m "Add radio system foundation"
          git push origin HEAD:main
