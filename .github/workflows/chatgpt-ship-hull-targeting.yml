name: Apply ship hull targeting

on:
  push:
    branches:
      - agent/target-cycle-screen-priority
    paths:
      - .github/workflows/chatgpt-ship-hull-targeting.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-ship-hull-targeting
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-cycle-screen-priority
          fetch-depth: 0

      - name: Keep ship subsystems display-only for targeting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_cycle = '''    function cycleTarget() {
                if (gameState !== STATE_PLAYING) return;
                const alive = enemies.filter((enemy) => enemy.alive);
          '''
          new_cycle = '''    function cycleTarget() {
                if (gameState !== STATE_PLAYING) return;
                // Ship turrets/VLS remain HUD contacts and destructible records, but
                // Triangle/Tab treats each vessel as one target: its hull record.
                const alive = enemies.filter((enemy) => enemy.alive && !enemy.subsystem);
          '''
          if text.count(old_cycle) != 1:
              raise RuntimeError(f'cycleTarget anchor count={text.count(old_cycle)}')
          text = text.replace(old_cycle, new_cycle, 1)

          old_lock = '''    function canLock(enemy, lockKind) {
          '''
          new_lock = '''    function canLock(enemy, lockKind) {
                // Subsystems stay visible/destructible, but seekers acquire the vessel
                // hull only. This also keeps single- and multi-lock weapons consistent.
                if (!enemy || enemy.subsystem) return false;
          '''
          if text.count(old_lock) != 1:
              raise RuntimeError(f'canLock anchor count={text.count(old_lock)}')
          text = text.replace(old_lock, new_lock, 1)

          required = (
              'enemy.alive && !enemy.subsystem',
              'if (!enemy || enemy.subsystem) return false;',
              'function visibleTargetCycleEntry(enemy)',
          )
          for needle in required:
              if needle not in text:
                  raise RuntimeError(f'missing expected source: {needle}')

          module = re.search(r'<script type="module">\n(?P<body>.*)\n  </script>', text, re.DOTALL)
          if not module:
              raise RuntimeError('could not extract index module')
          with tempfile.TemporaryDirectory() as temp_dir:
              module_path = Path(temp_dir) / 'index-module.mjs'
              module_path.write_text(module.group('body'), encoding='utf-8', newline='\n')
              subprocess.run(['node', '--check', str(module_path)], check=True)

          path.write_text(text, encoding='utf-8', newline='\n')
          print('ship hull targeting patch applied and module syntax checked')
          PY

      - name: Static diff check
        run: git diff --check

      - name: Remove integration workflow
        run: git rm .github/workflows/chatgpt-ship-hull-targeting.yml

      - name: Commit and push integrated result
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html
          git commit -m 'Target ship hulls instead of subsystems'
          git push origin HEAD:agent/target-cycle-screen-priority
