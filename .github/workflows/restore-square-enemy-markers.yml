name: Restore square enemy HUD markers

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".square-markers-ready"

permissions:
  contents: write

concurrency:
  group: restore-square-enemy-markers
  cancel-in-progress: true

jobs:
  patch-static-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore square markers, validate, clean up, and publish
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          module_before = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if len(module_before) != 1:
              raise SystemExit(f"expected one module script, found {len(module_before)}")

          pattern = re.compile(r'    \.enemyMarker \{\n.*?(?=    \.enemyMarkerLabel \{)', re.S)
          matches = pattern.findall(text)
          if len(matches) != 1:
              raise SystemExit(f"enemy marker CSS block count was {len(matches)}, expected 1")

          restored = "\n".join([
              "    .enemyMarker {",
              "      position: absolute;",
              "      width: 36px;",
              "      height: 36px;",
              "      transform: translate(-50%, -50%);",
              "      border: 1px solid rgba(112, 255, 151, 0.92);",
              "      color: #78ff9d;",
              "      opacity: 0;",
              "      visibility: hidden;",
              "      filter: drop-shadow(0 0 5px rgba(65, 255, 126, 0.68));",
              "      transition: opacity 90ms ease, width 90ms ease, height 90ms ease, color 90ms ease;",
              "      will-change: left, top;",
              "    }",
              "",
              "    .enemyMarker::before {",
              "      content: \"\";",
              "      position: absolute;",
              "      inset: 5px;",
              "      border: 1px solid currentColor;",
              "      opacity: 0.28;",
              "    }",
              "",
              "    .enemyMarker.active {",
              "      opacity: 0.88;",
              "      visibility: visible;",
              "    }",
              "",
              "    .enemyMarker.selected {",
              "      width: 43px;",
              "      height: 43px;",
              "      color: #ffe66f;",
              "      border-color: currentColor;",
              "      filter: drop-shadow(0 0 7px rgba(255, 224, 88, 0.82));",
              "    }",
              "",
              "    .enemyMarker.locked {",
              "      color: #ff5968;",
              "      border-color: currentColor;",
              "    }",
              "",
              "",
          ])
          text = pattern.sub(restored, text, count=1)

          required = [
              'width: 36px;\n      height: 36px;',
              'border: 1px solid rgba(112, 255, 151, 0.92);',
              'color: #78ff9d;',
              '.enemyMarker::before {\n      content: "";',
              'width: 43px;\n      height: 43px;',
              'label.textContent = `TGT ${enemy.id} · ${enemy.label} · ${distance}M`;',
              'forwardOf(enemy.group, tmpV4);',
              'ctx.rotate(headingAngle);',
              'primary: 0xf2f5f7,',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing required preserved/restored marker: {marker}")

          obsolete = [
              'clip-path: polygon(50% 100%, 0 0, 100% 0);',
              '.enemyMarker.selected,\n    .enemyMarker.locked {',
              'border-radius: 50%;',
          ]
          for marker in obsolete:
              if marker in text:
                  raise SystemExit(f"obsolete chevron/circle marker CSS remains: {marker}")

          module_after = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if module_after != module_before:
              raise SystemExit("module script changed during CSS-only restoration")

          for element_id in ['score', 'highscore', 'health', 'missiles', 'kills', 'state', 'startBtn', 'retryBtn']:
              if text.count(f'id="{element_id}"') != 1:
                  raise SystemExit(f"required DOM id {element_id!r} is missing or duplicated")

          if 'three@0.180.0' not in text or '@latest' in text:
              raise SystemExit("Three.js version pin changed")
          if 'console.warn(' in text or 'console.error(' in text:
              raise SystemExit("console warning/error call added")

          path.write_text(text, encoding="utf-8")
          Path('/tmp/sortie-game.mjs').write_text(module_after[0], encoding='utf-8')
          PY

          node --check /tmp/sortie-game.mjs
          git diff --check

          rm -f .github/workflows/restore-square-enemy-markers.yml

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines())
          expected = {
              "index.html",
              ".github/workflows/restore-square-enemy-markers.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected staged files: {sorted(changed)}")
          PY

          git commit -m "Restore square enemy HUD markers"
          git push origin HEAD:main
