name: Enhance combat feedback and speed presentation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".sortie-feedback/ready"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply feedback upgrade and run regressions
        shell: bash
        run: |
          set +e
          diagnostic=.sortie-feedback/diagnostic.txt
          : > "$diagnostic"

          python3 .sortie-feedback/apply_update.py >> "$diagnostic" 2>&1
          patch_status=$?
          echo "patch_status=$patch_status" >> "$diagnostic"

          instrument_status=99
          static_status=99
          node_status=99
          browser_test_hash_status=99
          browser_test_node_status=99
          npm_status=99
          browser_status=99

          if [ "$patch_status" -eq 0 ]; then
            python3 .sortie-feedback/instrument_inputs.py >> "$diagnostic" 2>&1
            instrument_status=$?
          fi
          echo "instrument_status=$instrument_status" >> "$diagnostic"

          if [ "$instrument_status" -eq 0 ]; then
            python3 - <<'PY' >> "$diagnostic" 2>&1
          from pathlib import Path
          import re

          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one module script, found {len(scripts)}")
          Path("/tmp/sortie-game.mjs").write_text(scripts[0], encoding="utf-8")

          required = [
              "const BOOST_SPEED_RESPONSE_K = 0.22;",
              "const BRAKE_SPEED_RESPONSE_K = 0.16;",
              "const CRUISE_SPEED_RESPONSE_K = 0.32;",
              "const HIGH_SPEED_FOV_BONUS = 8;",
              "const directionHeld = cameraKeyHold.pressed || cameraKeyHold.focus ||",
              'targetArrowState.mode = "onscreen";',
              "function createParticlePool(capacity, options)",
              "new THREE.Points(bufferGeometry, material)",
              "function createDestroyedPopup(position, label, points)",
              "function updatePlayerDamageSmoke(dt)",
              "hook.debug.activeParticles",
              "hook.debug.activeAudioSources",
              "hook.debug.keyboardTargetHeld",
              "hook.debug.gamepadTargetHeld",
              'title.textContent = "DESTROYED";',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing feedback marker: {marker}")

          forbidden = [
              "const BOOST_SPEED_RESPONSE_K = 0.006;",
              "const BRAKE_SPEED_RESPONSE_K = 0.018;",
              "const directionHeld = cameraKeyHold.pressed || gamepadInput.previousTarget;",
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f"obsolete implementation remains: {marker}")

          if "console.warn(" in text or "console.error(" in text:
              raise SystemExit("console warning/error call added")
          PY
            static_status=$?
          fi
          echo "static_status=$static_status" >> "$diagnostic"

          if [ "$static_status" -eq 0 ]; then
            node --check /tmp/sortie-game.mjs >> "$diagnostic" 2>&1
            node_status=$?
          fi
          echo "node_status=$node_status" >> "$diagnostic"

          assembled_test=.sortie-feedback/browser-feedback-test-exact.mjs
          cat .sortie-feedback/browser_test_v2.b64.* | tr -d '\n\r' | base64 -d > "$assembled_test" 2>> "$diagnostic"
          assembled_test_status=$?
          echo "assembled_test_status=$assembled_test_status" >> "$diagnostic"

          if [ "$assembled_test_status" -eq 0 ]; then
            browser_test_hash="$(git hash-object "$assembled_test")"
            echo "browser_test_hash=$browser_test_hash" >> "$diagnostic"
            if [ "$browser_test_hash" = "7f9545fd0714c16f91899fea0654bec321ac4ab0" ]; then
              browser_test_hash_status=0
            else
              browser_test_hash_status=1
            fi
          fi
          echo "browser_test_hash_status=$browser_test_hash_status" >> "$diagnostic"

          if [ "$browser_test_hash_status" -eq 0 ]; then
            node --check "$assembled_test" >> "$diagnostic" 2>&1
            browser_test_node_status=$?
          fi
          echo "browser_test_node_status=$browser_test_node_status" >> "$diagnostic"

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome_bin=$chrome_bin" >> "$diagnostic"

          if [ "$node_status" -eq 0 ] && [ "$browser_test_node_status" -eq 0 ] && [ -n "$chrome_bin" ]; then
            npm install --prefix .sortie-feedback --no-package-lock --no-save playwright-core@1.54.1 >> "$diagnostic" 2>&1
            npm_status=$?
          fi
          echo "npm_status=$npm_status" >> "$diagnostic"

          if [ "$npm_status" -eq 0 ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sortie-feedback-server.log 2>&1 &
            server_pid=$!
            sleep 1
            CHROME_BIN="$chrome_bin" node "$assembled_test" >> "$diagnostic" 2>&1
            browser_status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo "--- server log ---" >> "$diagnostic"
            cat /tmp/sortie-feedback-server.log >> "$diagnostic" 2>&1
          fi
          echo "browser_status=$browser_status" >> "$diagnostic"

          rm -rf .sortie-feedback/node_modules
          rm -f "$assembled_test"
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"

          if [ "$patch_status" -eq 0 ] && [ "$instrument_status" -eq 0 ] &&
             [ "$static_status" -eq 0 ] && [ "$node_status" -eq 0 ] &&
             [ "$browser_test_hash_status" -eq 0 ] && [ "$browser_test_node_status" -eq 0 ] &&
             [ "$npm_status" -eq 0 ] && [ "$browser_status" -eq 0 ]; then
            rm -rf .sortie-feedback
            rm -f .github/workflows/enhance-combat-feedback.yml
            git add -A
            git diff --cached --check
            git commit -m "Enhance combat feedback and speed presentation"
            git push origin HEAD:main
            exit 0
          fi

          git checkout -- index.html 2>/dev/null || true
          git add "$diagnostic"
          git commit -m "Record combat feedback regression diagnostics"
          git push origin HEAD:main
          cat "$diagnostic"
          exit 1
