name: split-combat debug navigation probe

on:
  push:
    branches:
      - chatgpt/split-combat
    paths:
      - .github/workflows/chatgpt-split-combat-diagnose-once.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/split-combat
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current split
        run: python tools/chatgpt_split_combat_patch.py
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Probe debug navigation contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const http = require('node:http');
          const path = require('node:path');
          const { chromium } = require('playwright');
          const MIME = { '.html':'text/html', '.js':'text/javascript', '.css':'text/css', '.json':'application/json' };
          const root = process.cwd();
          const server = http.createServer((req, res) => {
            const url = decodeURIComponent(req.url.split('?')[0]);
            const file = path.join(root, url === '/' ? 'index.html' : url);
            fs.readFile(file, (err, data) => {
              if (err) { res.writeHead(404); res.end('not found'); return; }
              res.writeHead(200, { 'Content-Type': MIME[path.extname(file)] || 'application/octet-stream' });
              res.end(data);
            });
          });
          (async () => {
            await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
            const browser = await chromium.launch({ args: ['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'] });
            const context = await browser.newContext();
            await context.addInitScript(() => { navigator.getGamepads = () => []; });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror:${e}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`console:${m.text()}`); });
            await page.goto(`http://127.0.0.1:${server.address().port}/index.html`, { waitUntil:'load' });
            await page.waitForFunction(() => window.__game?.debug, null, { timeout:45000 });
            const result = await page.evaluate(async () => {
              const d = window.__game.debug;
              const snap = label => ({
                label,
                state: window.__game.state,
                campaign: window.__game.campaign || null,
                keys: label === 'initial' ? Object.keys(d).sort() : undefined,
                missionKeys: typeof d.missionKeys === 'function' ? d.missionKeys().slice(0, 4) : null
              });
              const out = [snap('initial')];
              const call = (name, ...args) => {
                try { return typeof d[name] === 'function' ? d[name](...args) : `missing:${name}`; }
                catch (e) { return `throw:${e.message}`; }
              };
              out.push({ action:'forceCampaign usa', value:call('forceCampaign','usa'), after:snap('after forceCampaign') });
              out.push({ action:'forceSelectMission m01', value:call('forceSelectMission','m01'), after:snap('after forceSelectMission') });
              out.push({ action:'forceConfirmMission', value:call('forceConfirmMission'), after:snap('after forceConfirmMission') });
              out.push({ action:'forceMissionCursor 0', value:call('forceMissionCursor',0), after:snap('after forceMissionCursor') });
              out.push({ action:'forceSelectMission m01 second', value:call('forceSelectMission','m01'), after:snap('after second select') });
              const ids = ['startBtn','campaignConfirmBtn','missionConfirmBtn','briefingLaunchBtn','briefingStartBtn'];
              out.push({ dom: Object.fromEntries(ids.map(id => {
                const el = document.getElementById(id);
                return [id, el ? { text:el.textContent, hidden:el.classList.contains('hidden'), disabled:el.disabled } : null];
              })) });
              return out;
            });
            console.log(JSON.stringify(result, null, 2));
            if (errors.length) console.log('ERRORS\n' + errors.join('\n'));
            await context.close(); await browser.close(); server.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
