name: Verify Sera M02 in Chromium

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - index.html
      - payloads/map_amalPlain.payload.js
      - payloads/mission_sera_m02.payload.js
      - tools/check_map_amal_plain.mjs
      - tools/check_sera_m02_payload.mjs
      - tools/check_sera_m02_host.mjs
      - tools/check_sera_m02_e2e.mjs
      - .github/workflows/verify-sera-m02-e2e.yml

permissions:
  contents: read

concurrency:
  group: verify-sera-m02-e2e
  cancel-in-progress: true

jobs:
  m02-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run M02 and M01 static contracts
        run: |
          node tools/check_map_amal_plain.mjs
          node tools/check_sera_m02_payload.mjs
          node tools/check_sera_m02_host.mjs
          node tools/check_sera_m01_payload.mjs
          node tools/check_map_ren_bay.mjs
          node tools/check_air_iff_foundation.mjs
          node tools/check_legacy_airframe_variants.mjs
          node tools/check_fa18f_spw_select.mjs
          node tools/check_multirole_mobility_balance.mjs
          node --check tools/check_sera_m02_e2e.mjs
          git diff --check

      - name: Install Chromium harness
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run registry gates
        shell: bash
        run: |
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs --payloads=payloads/map_amalPlain.payload.js,payloads/mission_sera_m02.payload.js

      - name: Start local game server
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/sortie-http.log 2>&1 &
          echo $! > /tmp/sortie-http.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sortie-http.log
          exit 1

      - name: Run full M02 browser E2E
        run: node tools/check_sera_m02_e2e.mjs

      - name: Preserve M01 vertical-slice regression
        run: node tools/check_sera_m01_e2e.mjs

      - name: Stop local game server
        if: always()
        run: |
          if [ -f /tmp/sortie-http.pid ]; then kill "$(cat /tmp/sortie-http.pid)" || true; fi
