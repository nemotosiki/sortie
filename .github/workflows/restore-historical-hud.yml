name: Restore historical HUD visuals

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/restore_hud_from_ae212.py
      - .github/workflows/restore-historical-hud.yml

permissions:
  contents: write

concurrency:
  group: restore-historical-hud
  cancel-in-progress: false

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Restore HUD from pre-IFF-colour code
        run: |
          python -m py_compile tools/restore_hud_from_ae212.py
          python tools/restore_hud_from_ae212.py

      - name: Run static regression contracts
        run: |
          node tools/check_air_iff_foundation.mjs
          node tools/check_map_ren_bay.mjs
          node tools/check_sera_m01_payload.mjs
          node tools/check_map_amal_plain.mjs
          node tools/check_sera_m02_payload.mjs
          node tools/check_sera_m02_host.mjs
          node tools/check_legacy_airframe_variants.mjs
          node tools/check_fa18f_spw_select.mjs
          node tools/check_multirole_mobility_balance.mjs
          git diff --check

      - name: Install Chromium harness
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify historical HUD and mission regressions in Chromium
        shell: bash
        run: |
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs

          python -m http.server 8000 --bind 127.0.0.1 > /tmp/sortie-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html > /dev/null; then break; fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--disable-gpu-sandbox'] });
          try {
            const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded', timeout: 120000 });
            const hud = await page.evaluate(() => {
              const host = document.getElementById('enemyMarkers');
              const marker = document.createElement('div');
              marker.className = 'enemyMarker active';
              host.appendChild(marker);
              const base = getComputedStyle(marker);
              const result = {
                baseColor: base.color,
                baseBorder: base.borderTopColor,
                baseBorderWidth: base.borderTopWidth
              };
              marker.classList.add('selected');
              const selected = getComputedStyle(marker);
              result.selectedOutline = selected.outlineStyle;
              marker.classList.remove('selected');
              marker.classList.add('locked');
              const locked = getComputedStyle(marker);
              result.lockedColor = locked.color;
              result.lockedBorderWidth = locked.borderTopWidth;
              marker.remove();
              return result;
            });
            const assert = (condition, message) => { if (!condition) throw new Error(`${message}: ${JSON.stringify(hud)}`); };
            assert(hud.baseColor === 'rgb(120, 255, 157)', 'legacy green contact colour missing');
            assert(hud.baseBorder.includes('112, 255, 151'), 'legacy green contact border missing');
            assert(hud.baseBorderWidth === '1px', 'legacy contact border width changed');
            assert(hud.selectedOutline === 'none', 'selection outline was not restored away');
            assert(hud.lockedColor === 'rgb(255, 89, 104)', 'legacy red lock colour missing');
            assert(hud.lockedBorderWidth === '1px', 'legacy lock border width changed');
            console.log('historical HUD computed-style gate: PASS', hud);
          } finally {
            await browser.close();
          }
          NODE

          node tools/check_sera_m01_e2e.mjs

      - name: Commit restored HUD
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html tools/check_air_iff_foundation.mjs
          git rm tools/restore_hud_from_ae212.py
          git diff --cached --check
          git commit -m 'Restore historical HUD visuals'
          git push origin HEAD:chatgpt/sera-act1-implementation
