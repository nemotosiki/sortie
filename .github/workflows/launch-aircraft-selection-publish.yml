name: Launch selectable aircraft publish

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: add-aircraft-selection-pr
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.title == 'Run selectable aircraft static publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute staged publisher
        id: publisher
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/aircraft-selection-diagnostic.txt) 2>&1
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/add-aircraft-selection.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if workflow.count(marker) != 1:
              raise SystemExit('staged publisher shell block was not uniquely identifiable')
          block = workflow.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if not line:
                  lines.append('')
              elif line.startswith('          '):
                  lines.append(line[10:])
              else:
                  raise SystemExit(f'unexpected staged publisher indentation: {line!r}')
          script = '\n'.join(lines) + '\n'
          cleanup = 'rm -f .github/workflows/add-aircraft-selection.yml'
          cleanup_replacement = cleanup + ' .github/workflows/launch-aircraft-selection-publish.yml .aircraft-selection-merge-trigger'
          if script.count(cleanup) != 1:
              raise SystemExit('staged publisher cleanup command was not uniquely identifiable')
          script = script.replace(cleanup, cleanup_replacement, 1)
          expected = "expected = {'index.html', '.github/workflows/add-aircraft-selection.yml'}"
          expected_replacement = "expected = {'index.html', '.github/workflows/add-aircraft-selection.yml', '.github/workflows/launch-aircraft-selection-publish.yml', '.aircraft-selection-merge-trigger'}"
          if script.count(expected) != 1:
              raise SystemExit('staged publisher expected-files check was not uniquely identifiable')
          script = script.replace(expected, expected_replacement, 1)
          Path('/tmp/run-aircraft-publisher.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/run-aircraft-publisher.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aircraft-selection-diagnostic
          path: /tmp/aircraft-selection-diagnostic.txt
          if-no-files-found: error

      - name: Propagate publisher result
        if: steps.publisher.outcome != 'success'
        run: exit 1
