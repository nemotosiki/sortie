name: Assemble Sortie

on:
  push:
    branches: [main]
    paths:
      - ".sortie-build/ready"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify index.html
        shell: bash
        run: |
          set -euo pipefail
          cat .sortie-build/gz-*.b64 | base64 --decode | gzip --decompress > index.html
          test "$(wc -c < index.html)" -eq 74566
          test "$(sha256sum index.html | cut -d' ' -f1)" = "7723e0d9e22bc2acd5ca4d46eb8cda80a3d27781c5080547bd49fe8d09050779"
          rm -rf .sortie-build
          rm -f .init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Sortie arcade air combat mission"
          git push origin HEAD:main
