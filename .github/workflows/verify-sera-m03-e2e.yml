name: Verify Sera M03 in Chromium

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - index.html
      - payloads/ground_heli_pack.payload.js
      - payloads/map_sarkPort.payload.js
      - payloads/mission_sera_m03.payload.js
      - tools/check_sera_m03_runtime_host.mjs
      - tools/check_sera_m03_inline.mjs
      - tools/check_sera_m03_payload.mjs
      - tools/check_sera_m03_e2e.mjs
      - tools/registry_snapshot.json
      - .github/workflows/verify-sera-m03-e2e.yml

permissions:
  contents: read

concurrency:
  group: verify-sera-m03-e2e
  cancel-in-progress: true

jobs:
  m03-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run M03 static contracts
        run: |
          node tools/check_sera_m03_inline.mjs
          node tools/check_sera_m03_runtime_host.mjs
          node tools/check_sera_m03_payload.mjs
          node tools/check_map_sark_port.mjs
          node tools/check_sera_m03_preflight.mjs
          node --check tools/check_sera_m03_e2e.mjs
          git diff --check

      - name: Install Chromium harness
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run normal-start registry gate
        shell: bash
        run: |
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs

      - name: Start local game server
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/sortie-http.log 2>&1 &
          echo $! > /tmp/sortie-http.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sortie-http.log
          exit 1

      - name: Run full M03 browser E2E
        run: node tools/check_sera_m03_e2e.mjs

      - name: Preserve M02 and M01 vertical slices
        run: |
          node tools/check_sera_m02_e2e.mjs
          node tools/check_sera_m01_e2e.mjs

      - name: Stop local game server
        if: always()
        run: |
          if [ -f /tmp/sortie-http.pid ]; then kill "$(cat /tmp/sortie-http.pid)" || true; fi
