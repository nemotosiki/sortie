name: Publish expert flight controls

on:
  push:
    branches: [main]
    paths:
      - ".sortie-expert/payload.tgz.b64"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, validate, and publish
        shell: bash
        run: |
          set +e
          work=/tmp/sortie-expert
          diagnostic=.sortie-expert/diagnostic.txt
          mkdir -p "$work"
          : > "$diagnostic"
          base64 --decode .sortie-expert/payload.tgz.b64 | tar -xz -C "$work" >> "$diagnostic" 2>&1
          unpack_status=$?
          echo "unpack_status=$unpack_status" >> "$diagnostic"

          if [ "$unpack_status" -eq 0 ]; then
            python3 "$work/apply_expert.py" >> "$diagnostic" 2>&1
            patch_status=$?
          else
            patch_status=99
          fi
          echo "patch_status=$patch_status" >> "$diagnostic"

          if [ "$patch_status" -eq 0 ]; then
            node --check /tmp/sortie-game.mjs >> "$diagnostic" 2>&1
            node_status=$?
          else
            node_status=99
          fi
          echo "node_status=$node_status" >> "$diagnostic"

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome_bin=$chrome_bin" >> "$diagnostic"

          if [ "$patch_status" -eq 0 ] && [ "$node_status" -eq 0 ] && [ -n "$chrome_bin" ]; then
            npm install --prefix "$work" --no-package-lock --no-save playwright-core@1.54.1 >> "$diagnostic" 2>&1
            npm_status=$?
          else
            npm_status=99
          fi
          echo "npm_status=$npm_status" >> "$diagnostic"

          browser_status=99
          if [ "$npm_status" -eq 0 ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sortie-expert-server.log 2>&1 &
            server_pid=$!
            sleep 1
            CHROME_BIN="$chrome_bin" node "$work/browser_test.mjs" >> "$diagnostic" 2>&1
            browser_status=$?
            kill "$server_pid" 2>/dev/null || true
            echo "--- server log ---" >> "$diagnostic"
            cat /tmp/sortie-expert-server.log >> "$diagnostic" 2>&1
          fi
          echo "browser_status=$browser_status" >> "$diagnostic"

          rm -rf "$work"
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"

          if [ "$unpack_status" -eq 0 ] && [ "$patch_status" -eq 0 ] && [ "$node_status" -eq 0 ] && [ "$npm_status" -eq 0 ] && [ "$browser_status" -eq 0 ]; then
            rm -rf .sortie-expert
            rm -f .github/workflows/expert-flight-controls.yml
            git add -A
            git commit -m "Add expert flight controls"
            git push origin HEAD:main
            exit 0
          fi

          git checkout -- index.html 2>/dev/null || true
          git add "$diagnostic"
          git commit -m "Record expert controls diagnostics"
          git push origin HEAD:main
          cat "$diagnostic"
          exit 1
