name: Apply F-15 4AAM integration

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/apply_f15_4aam.py
      - .github/workflows/apply-f15-4aam.yml

permissions:
  contents: write

concurrency:
  group: apply-f15-4aam
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Apply 4AAM loadouts
        run: python tools/apply_f15_4aam.py

      - name: Run focused regression checks
        run: |
          node tools/check_legacy_airframe_variants.mjs
          node tools/check_air_iff_foundation.mjs
          node tools/check_map_ren_bay.mjs
          node tools/check_sera_m01_payload.mjs
          git diff --check
          grep -q 'F-15C EAGLE' index.html
          grep -q 'F-15E STRIKE EAGLE' index.html

      - name: Commit F-15 4AAM loadouts
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html tools/check_legacy_airframe_variants.mjs
          git rm tools/apply_f15_4aam.py .github/workflows/apply-f15-4aam.yml
          git commit -m 'Equip F-15C and F-15E with 4AAM'
          git push origin HEAD:chatgpt/sera-act1-implementation
