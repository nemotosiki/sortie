name: Apply map texture visual QA fix

on:
  push:
    branches:
      - chatgpt/map-texture-upgrade-visual-fix-runner

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out runner branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/map-texture-upgrade-visual-fix-runner
          fetch-depth: 0

      - name: Record run and current target history
        run: |
          set -euo pipefail
          git fetch origin main chatgpt/map-texture-upgrade
          printf '%s\n' '${{ github.run_id }}' > visual-fix-run-id.txt
          git log --pretty=format:'%H%x09%s' origin/main..origin/chatgpt/map-texture-upgrade > visual-fix-target-log.txt
          printf '\n' >> visual-fix-target-log.txt
          git config user.name 'ChatGPT Visual QA'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add visual-fix-run-id.txt visual-fix-target-log.txt
          git commit -m 'ci: record visual QA patch run [skip ci]'
          git push origin HEAD:chatgpt/map-texture-upgrade-visual-fix-runner

      - name: Check out target branch without rewriting history
        run: |
          set -euo pipefail
          git checkout -B chatgpt/map-texture-upgrade origin/chatgpt/map-texture-upgrade
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/chatgpt/map-texture-upgrade)"
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          cp index.html /tmp/index-before.html

      - name: Capture protected function hashes
        run: |
          cat > /tmp/protected_hashes.py <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          names = ('surfaceHeightAt', 'spawnNavalWave', 'disposeWorld', 'updateWorld')

          def extract_function(text, name):
              marker = f'function {name}('
              start = text.index(marker)
              brace = text.index('{', start)
              depth = 0
              state = 'code'
              escaped = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'line':
                      if ch == '\n': state = 'code'
                  elif state == 'block':
                      if ch == '*' and nxt == '/':
                          state = 'code'; i += 1
                  elif state in ('single', 'double', 'template'):
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif (state == 'single' and ch == "'") or (state == 'double' and ch == '"') or (state == 'template' and ch == '`'):
                          state = 'code'
                  else:
                      if ch == '/' and nxt == '/':
                          state = 'line'; i += 1
                      elif ch == '/' and nxt == '*':
                          state = 'block'; i += 1
                      elif ch == "'": state = 'single'
                      elif ch == '"': state = 'double'
                      elif ch == '`': state = 'template'
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return text[start:i + 1]
                  i += 1
              raise RuntimeError(f'unclosed function {name}')

          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          result = {name: hashlib.sha256(extract_function(source, name).encode()).hexdigest() for name in names}
          print(json.dumps(result, sort_keys=True))
          PY
          python /tmp/protected_hashes.py /tmp/index-before.html > /tmp/protected-before.json

      - name: Install deterministic visual QA patcher
        shell: bash
        env:
          PATCHER_GZ_B64: 
        run: |
          printf '%s' "$PATCHER_GZ_B64" | base64 -d | gzip -d > /tmp/polish_patcher.py
          python -m py_compile /tmp/polish_patcher.py

      - name: Apply ocean and billboard-cloud visual fix
        run: |
          set -euo pipefail
          python /tmp/polish_patcher.py
          python /tmp/protected_hashes.py index.html > /tmp/protected-after.json
          diff -u /tmp/protected-before.json /tmp/protected-after.json
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('CRLF detected')
          modules = re.findall(r'<script type="module">(.*?)</script>', text, re.S)
          if len(modules) != 1:
              raise SystemExit(f'expected one module script, found {len(modules)}')
          Path('/tmp/sortie-module.mjs').write_text(modules[0], encoding='utf-8', newline='\n')
          required = ('new THREE.Sprite(cloudMaterials', 'new THREE.Sprite(cirrusMaterials', 'function makeOceanNormalTexture')
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f'missing visual fix tokens: {missing}')
          PY
          node --check /tmp/sortie-module.mjs
          git diff --check
          test "$(git diff --name-only)" = "index.html"

      - name: Commit one focused QA theme
        run: |
          git add index.html
          git commit -m "fix(world): refine ocean breakup and cloud silhouettes" -m "Keeps the existing ocean speckles and world-locked follow logic, but rotates the speckle strokes and replaces the stripe-prone three-wave normal with a warped multi-scale field. Replaces cloud sphere puffs with CanvasTexture Sprite billboards while preserving cloud placement, RNG consumption, fly-through volumes, and mission logic. Generated texture count and dimensions are unchanged, so estimated texture memory is unchanged. Target-hardware FPS is not measured in CI; browser validation follows."
          git push origin HEAD:refs/heads/chatgpt/map-texture-upgrade
