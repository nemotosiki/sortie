name: Print generated Sera M01 E2E lines

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - .github/workflows/print-sera-m01-e2e-lines.yml

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
      - name: Generate current E2E source
        run: |
          python tools/apply_sera_m01_finish.py
          python tools/fix_sera_m01_retry_checkpoint.py
          python tools/apply_sera_m01_debug_probe.py
      - name: Print failure neighborhood
        run: |
          nl -ba tools/check_sera_m01_e2e.mjs | sed -n '225,245p'
