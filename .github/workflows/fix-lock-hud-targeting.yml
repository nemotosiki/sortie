name: Fix lock targeting and enemy HUD markers

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".sortie-lock-hud/ready"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeting fix and run regressions
        shell: bash
        run: |
          set +e
          diagnostic=.sortie-lock-hud/diagnostic.txt
          : > "$diagnostic"

          python3 .sortie-lock-hud/apply_update.py >> "$diagnostic" 2>&1
          patch_status=$?
          echo "patch_status=$patch_status" >> "$diagnostic"

          static_status=99
          node_status=99
          if [ "$patch_status" -eq 0 ]; then
            python3 - <<'PY' >> "$diagnostic" 2>&1
          from pathlib import Path
          import re

          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one module script, found {len(scripts)}")
          Path("/tmp/sortie-game.mjs").write_text(scripts[0], encoding="utf-8")

          required = [
              "candidate = preferredCandidate || candidate;",
              "function updateEnemyHudMarkers()",
              "function updateTargetDirectionArrow()",
              'id="enemyMarkers"',
              'id="targetDirectionArrow"',
              "hook.hud.visibleEnemyMarkers",
              "hook.hud.targetArrow.active",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing targeting/HUD marker: {marker}")
          if "if (preferred && enemy.id !== preferred.id) continue;" in text:
              raise SystemExit("exclusive preferred-target filter remains")
          PY
            static_status=$?
            if [ "$static_status" -eq 0 ]; then
              node --check /tmp/sortie-game.mjs >> "$diagnostic" 2>&1
              node_status=$?
            fi
          fi
          echo "static_status=$static_status" >> "$diagnostic"
          echo "node_status=$node_status" >> "$diagnostic"

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome_bin=$chrome_bin" >> "$diagnostic"

          npm_status=99
          if [ "$patch_status" -eq 0 ] && [ "$static_status" -eq 0 ] && [ "$node_status" -eq 0 ] && [ -n "$chrome_bin" ]; then
            npm install --prefix .sortie-lock-hud --no-package-lock --no-save playwright-core@1.54.1 >> "$diagnostic" 2>&1
            npm_status=$?
          fi
          echo "npm_status=$npm_status" >> "$diagnostic"

          browser_status=99
          server_pid=""
          if [ "$npm_status" -eq 0 ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sortie-lock-hud-server.log 2>&1 &
            server_pid=$!
            sleep 1
            CHROME_BIN="$chrome_bin" node .sortie-lock-hud/browser_test.mjs >> "$diagnostic" 2>&1
            browser_status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo "--- server log ---" >> "$diagnostic"
            cat /tmp/sortie-lock-hud-server.log >> "$diagnostic" 2>&1
          fi
          echo "browser_status=$browser_status" >> "$diagnostic"

          rm -rf .sortie-lock-hud/node_modules
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"

          if [ "$patch_status" -eq 0 ] && [ "$static_status" -eq 0 ] && [ "$node_status" -eq 0 ] && [ "$npm_status" -eq 0 ] && [ "$browser_status" -eq 0 ]; then
            rm -rf .sortie-lock-hud
            rm -f .github/workflows/fix-lock-hud-targeting.yml
            git add -A
            git diff --cached --check
            git commit -m "Fix lock targeting and add enemy HUD markers"
            git push origin "HEAD:main"
            exit 0
          fi

          git checkout -- index.html 2>/dev/null || true
          git add "$diagnostic"
          git commit -m "Record lock targeting and HUD diagnostics"
          git push origin "HEAD:main"
          cat "$diagnostic"
          exit 1
