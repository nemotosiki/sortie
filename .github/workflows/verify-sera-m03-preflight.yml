name: Verify Sera M03 Preflight

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/check_sera_m03_preflight.mjs
      - tools/inspect_sera_m03_host.mjs
      - .github/workflows/verify-sera-m03-preflight.yml
      - payloads/map_sarkPort.payload.js
      - payloads/ground_heli_pack.payload.js
      - payloads/mission_sera_m01.payload.js
      - payloads/mission_sera_m02.payload.js
      - docs/implementation/sera_m03_low_water_safe_implementation_plan.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect current host contracts
        run: node tools/inspect_sera_m03_host.mjs
      - name: Check M03 prerequisites
        run: node tools/check_sera_m03_preflight.mjs
