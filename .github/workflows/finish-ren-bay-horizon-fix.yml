name: Finish Ren Bay horizon repair

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/finish_ren_bay_horizon_fix.py
      - .github/workflows/finish-ren-bay-horizon-fix.yml

permissions:
  contents: write

concurrency:
  group: finish-ren-bay-horizon-fix
  cancel-in-progress: false

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Apply Ren Bay landmass extension
        run: |
          python -m py_compile tools/finish_ren_bay_horizon_fix.py
          python tools/finish_ren_bay_horizon_fix.py
          node tools/check_map_ren_bay.mjs
          node tools/check_sera_m01_payload.mjs
          node tools/check_map_amal_plain.mjs
          node tools/check_sera_m02_payload.mjs
          node tools/check_sera_m02_host.mjs
          node tools/check_air_iff_foundation.mjs
          node tools/check_legacy_airframe_variants.mjs
          node tools/check_fa18f_spw_select.mjs
          node tools/check_multirole_mobility_balance.mjs
          git diff --check

      - name: Install Chromium harness
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify registry and capture Ren Bay preview
        shell: bash
        run: |
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs

          python -m http.server 8000 --bind 127.0.0.1 > /tmp/sortie-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html > /dev/null; then break; fi
            sleep 1
          done

          # Run the visual preview in its own browser process. The full normal
          # campaign E2Es below also launch their own clean browsers, avoiding
          # the headless-GL contention seen when two complete scenes were held
          # in one Chromium process.
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--disable-gpu-sandbox', '--disable-dev-shm-usage']
          });
          try {
            const page = await browser.newPage({ viewport: { width: 1600, height: 900 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error?.stack || error)));
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            await page.goto('http://127.0.0.1:8000/index.html?worldPreview=renBay', {
              waitUntil: 'domcontentloaded', timeout: 120000
            });
            await page.waitForSelector('canvas', { timeout: 120000 });
            await page.waitForTimeout(1600);
            if (pageErrors.length) throw new Error(`world preview pageerror: ${JSON.stringify(pageErrors)}`);
            if (consoleErrors.length) throw new Error(`world preview console error: ${JSON.stringify(consoleErrors)}`);
            await page.screenshot({ path: '/tmp/ren-bay-world-preview.png' });
            console.log('Ren Bay world preview: PASS');
          } finally {
            await browser.close();
          }
          NODE

          node tools/check_sera_m01_e2e.mjs
          node tools/check_sera_m02_e2e.mjs

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: ren-bay-horizon-preview
          path: /tmp/ren-bay-world-preview.png
          if-no-files-found: error

      - name: Commit verified horizon repair
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html payloads/map_renBay.payload.js tools/check_map_ren_bay.mjs
          git rm tools/apply_ren_bay_horizon_fix.py tools/finish_ren_bay_horizon_fix.py
          git diff --cached --check
          git commit -m 'Extend Ren Bay landmass beyond the flight horizon'
          git push origin HEAD:chatgpt/sera-act1-implementation
