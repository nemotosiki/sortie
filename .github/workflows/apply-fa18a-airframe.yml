name: Apply F/A-18A airframe

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/apply_fa18a_airframe.py
      - .github/workflows/apply-fa18a-airframe.yml

permissions:
  contents: write

concurrency:
  group: apply-fa18a-airframe
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Add F/A-18A
        run: python tools/apply_fa18a_airframe.py

      - name: Check patch
        run: |
          git diff --check
          grep -q 'F/A-18A HORNET' index.html
          grep -q 'theme.variant === "legacyhornet"' index.html
          grep -q '"fa18a", "fa18"' index.html

      - name: Commit F/A-18A
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html
          git rm tools/apply_fa18a_airframe.py .github/workflows/apply-fa18a-airframe.yml
          git commit -m 'Add F/A-18A legacy Hornet variant'
          git push origin HEAD:chatgpt/sera-act1-implementation
