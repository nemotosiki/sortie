name: Apply Sera M02 payload schema compatibility

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/apply_sera_m02_payload_schema.py
      - .github/workflows/apply-sera-m02-payload-schema.yml

permissions:
  contents: write

concurrency:
  group: apply-sera-m02-payload-schema
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Apply payload compatibility fix
        run: |
          python -m py_compile tools/apply_sera_m02_payload_schema.py
          python tools/apply_sera_m02_payload_schema.py

      - name: Run static contracts
        run: |
          node tools/check_sera_m02_payload.mjs
          node tools/check_map_amal_plain.mjs
          node tools/check_sera_m02_host.mjs
          node tools/check_sera_m01_payload.mjs
          git diff --check

      - name: Install Chromium harness
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify the payload registry schema
        shell: bash
        run: |
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs --payloads=payloads/map_amalPlain.payload.js,payloads/mission_sera_m02.payload.js

      - name: Commit verified payload compatibility
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add payloads/mission_sera_m02.payload.js tools/check_sera_m02_payload.mjs
          git diff --cached --check
          git commit -m 'Preserve Sera M02 payload schema'
          git push origin HEAD:chatgpt/sera-act1-implementation
