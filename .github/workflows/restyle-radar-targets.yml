name: Restyle tactical radar targets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restyle-radar-targets.yml"

permissions:
  contents: write

concurrency:
  group: restyle-radar-targets
  cancel-in-progress: false

jobs:
  patch-static-publish:
    if: github.event.head_commit.message == 'Run radar target restyle static publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply radar marker changes, validate, and publish
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old = '''      for (const enemy of enemies) {
            if (!enemy.alive) continue;
            tmpV3.copy(enemy.group.position).sub(player.position);
            const rightDistance = tmpV3.dot(tmpV2);
            const forwardDistance = tmpV3.dot(lastRadarForward);
            const planarDistance = Math.hypot(rightDistance, forwardDistance);
            const scale = Math.min(1, planarDistance / RADAR_RANGE);
            const angle = Math.atan2(rightDistance, forwardDistance);
            const px = center + Math.sin(angle) * radius * scale;
            const py = center - Math.cos(angle) * radius * scale;
            const locked = lock.locked && lock.targetId === enemy.id;

            ctx.fillStyle = locked ? "#fff06a" : enemy.spec.radarColor;
            ctx.shadowColor = locked ? "#fff06a" : enemy.spec.radarColor;
            ctx.shadowBlur = locked ? 10 : 6;
            ctx.beginPath();
            ctx.arc(px, py, locked ? 4 : 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          for (const missile of enemyMissiles) {
          '''

          new = '''      for (const enemy of enemies) {
            if (!enemy.alive) continue;
            tmpV3.copy(enemy.group.position).sub(player.position);
            const rightDistance = tmpV3.dot(tmpV2);
            const forwardDistance = tmpV3.dot(lastRadarForward);
            const planarDistance = Math.hypot(rightDistance, forwardDistance);
            const scale = Math.min(1, planarDistance / RADAR_RANGE);
            const angle = Math.atan2(rightDistance, forwardDistance);
            const px = center + Math.sin(angle) * radius * scale;
            const py = center - Math.cos(angle) * radius * scale;
            const isTarget = enemy.id === (preferredTargetId ?? lock.targetId);

            forwardOf(enemy.group, tmpV4);
            const headingRight = tmpV4.dot(tmpV2);
            const headingForward = tmpV4.dot(lastRadarForward);
            const headingAngle = Math.atan2(headingRight, headingForward);

            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(headingAngle);
            ctx.fillStyle = "#f4f7fa";
            ctx.shadowColor = "#f4f7fa";
            ctx.shadowBlur = isTarget ? 8 : 5;
            ctx.beginPath();
            ctx.moveTo(0, -4.5);
            ctx.lineTo(-3, 3);
            ctx.lineTo(0, 1);
            ctx.lineTo(3, 3);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            ctx.shadowBlur = 0;

            if (isTarget) {
              ctx.strokeStyle = lock.locked ? "#ff4f5e" : "#ffe66f";
              ctx.shadowColor = ctx.strokeStyle;
              ctx.shadowBlur = 9;
              ctx.lineWidth = 1.4;
              ctx.beginPath();
              ctx.arc(px, py, 7, 0, Math.PI * 2);
              ctx.stroke();
              ctx.shadowBlur = 0;
            }
          }

          for (const missile of enemyMissiles) {
          '''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"radar enemy block: expected exactly one occurrence, found {count}")
          text = text.replace(old, new, 1)

          required = [
              'const isTarget = enemy.id === (preferredTargetId ?? lock.targetId);',
              'forwardOf(enemy.group, tmpV4);',
              'const headingAngle = Math.atan2(headingRight, headingForward);',
              'ctx.rotate(headingAngle);',
              'ctx.fillStyle = "#f4f7fa";',
              'ctx.moveTo(0, -4.5);',
              'if (isTarget) {',
              'ctx.strokeStyle = lock.locked ? "#ff4f5e" : "#ffe66f";',
              'ctx.arc(px, py, 7, 0, Math.PI * 2);',
              'ctx.fillStyle = "#ffd84f";',
              'ctx.moveTo(px, py - 4);',
              'ctx.fillStyle = "#aaf8ff";',
              'primary: 0xf2f5f7,',
              'label.textContent = `TGT ${enemy.id} · ${enemy.label} · ${distance}M`;',
              'primary: 0x23262e,',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing required marker: {marker}")

          obsolete = [
              'ctx.fillStyle = locked ? "#fff06a" : enemy.spec.radarColor;',
              'ctx.shadowColor = locked ? "#fff06a" : enemy.spec.radarColor;',
              'ctx.arc(px, py, locked ? 4 : 3, 0, Math.PI * 2);',
          ]
          for marker in obsolete:
              if marker in text:
                  raise SystemExit(f"obsolete radar marker remains: {marker}")

          if text.count('ctx.rotate(headingAngle);') != 1:
              raise SystemExit("enemy heading rotation is missing or duplicated")
          if text.count('const isTarget = enemy.id === (preferredTargetId ?? lock.targetId);') != 1:
              raise SystemExit("radar target selection marker is missing or duplicated")

          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one module script, found {len(scripts)}")

          for element_id in ["score", "highscore", "health", "missiles", "kills", "state", "startBtn", "retryBtn"]:
              if text.count(f'id="{element_id}"') != 1:
                  raise SystemExit(f"required DOM id {element_id!r} is missing or duplicated")

          if "three@0.180.0" not in text or "@latest" in text:
              raise SystemExit("Three.js version pin changed")
          if "console.warn(" in text or "console.error(" in text:
              raise SystemExit("console warning/error call added")

          Path("/tmp/sortie-game.mjs").write_text(scripts[0], encoding="utf-8")
          path.write_text(text, encoding="utf-8")
          PY

          node --check /tmp/sortie-game.mjs
          git diff --check

          rm -f .github/workflows/restyle-radar-targets.yml

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines())
          expected = {
              "index.html",
              ".github/workflows/restyle-radar-targets.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected staged files: {sorted(changed)}")
          PY

          git commit -m "Restyle tactical radar enemy indicators"
          git push origin HEAD:main
