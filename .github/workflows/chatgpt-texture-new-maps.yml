name: ChatGPT new-map texture review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: chatgpt-texture-new-maps-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  patch-test-publish:
    if: github.head_ref == 'chatgpt/texture-new-maps'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_BASE: 88b5f5139162b0269e236628ce9435510171f8e1
      PUBLISH_APPROVED: 'false'
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify branch ancestry and unpack review tools
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          mkdir -p /tmp/texture-tools /tmp/texture-before artifacts
          cp index.html /tmp/texture-before/index.html
          # The baseline HTML references the repository's existing optional audio.
          # Mirror it into the baseline server so before/after have identical I/O.
          for asset_dir in bgm sfx; do
            if [ -d "$asset_dir" ]; then cp -a "$asset_dir" /tmp/texture-before/; fi
          done
          base64 -d _chatgpt_runner/texture_new_maps_patch.py.gz.b64 | gzip -d > /tmp/texture-tools/patch.py
          base64 -d _chatgpt_runner/texture_new_maps_probe.cjs.gz.b64 | gzip -d > /tmp/texture-tools/probe.cjs
          python3 -m py_compile /tmp/texture-tools/patch.py
          node --check /tmp/texture-tools/probe.cjs

      - name: Apply texture profiles to current main snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/texture-tools/patch.py index.html --report artifacts/patch-report.json | tee artifacts/patch.log
          git diff -- index.html > artifacts/index.patch
          test "$(git diff --name-only)" = "index.html"
          if git diff -U0 -- index.html | grep -E '^[+-].*(function (surfaceHeightAt|surfaceTopAt|disposeWorld)|ocean\.position\.(x|z)|spawnGroundUnit\()'; then
            echo 'Protected geometry/camera/disposal code appeared in the diff.' >&2
            exit 1
          fi
          cp /tmp/texture-before/index.html artifacts/index.before.html
          cp index.html artifacts/index.after.html

      - name: Parse-check the single-file module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not match:
              raise SystemExit('main module script not found')
          Path('/tmp/texture-tools/index-module.mjs').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/texture-tools/index-module.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install isolated Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/texture-playwright
          cd /tmp/texture-playwright
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start before and after servers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/texture-before > artifacts/server-before.log 2>&1 &
          echo $! > /tmp/texture-before.pid
          python3 -m http.server 4174 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > artifacts/server-after.log 2>&1 &
          echo $! > /tmp/texture-after.pid
          for port in 4173 4174; do
            for attempt in {1..40}; do
              curl -fsS "http://127.0.0.1:$port/index.html" >/dev/null && break
              sleep 0.5
            done
            curl -fsS "http://127.0.0.1:$port/index.html" >/dev/null
          done

      - name: Capture 18 frames and run texture regression gates
        shell: bash
        env:
          NODE_PATH: /tmp/texture-playwright/node_modules
        run: |
          set -euo pipefail
          node /tmp/texture-tools/probe.cjs \
            --before http://127.0.0.1:4173 \
            --after http://127.0.0.1:4174 \
            --out artifacts 2>&1 | tee artifacts/visual.log

      - name: Summarize gate result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artifacts/report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/report.json').read_text())
          print(f"## New-map texture gate: {report.get('status', 'unknown')}")
          gate = report.get('fpsGate') or {}
          print(f"- FPS mode: {gate.get('mode', 'n/a')}")
          print(f"- Renderer: {gate.get('renderer', 'n/a')}")
          print(f"- Ratios: {gate.get('ratios', {})}")
          for key, value in report.get('maps', {}).items():
              after = value.get('after', {})
              texture = ((after.get('views') or [{}])[0].get('texture') or {})
              print(f"- {key}: {texture.get('count', '?')} generated textures, {texture.get('estimatedMiB', '?')} MiB")
          PY
          else
            echo '## New-map texture gate: no report produced' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots, reports and tested HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-new-maps-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Publish tested index.html and remove review workflow
        if: success() && env.PUBLISH_APPROVED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/chatgpt-texture-new-maps.yml \
            _chatgpt_runner/texture_new_maps_patch.py.gz.b64 \
            _chatgpt_runner/texture_new_maps_probe.cjs.gz.b64
          git commit -m 'Upgrade textures for storm, desert and night city maps'
          git push origin "HEAD:$GITHUB_HEAD_REF"
