name: Strengthen lock-on and HUD-only view

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".lock-hud-ready"

permissions:
  contents: write

jobs:
  patch-static-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply lock and camera changes, validate, and publish
        shell: bash
        run: |
          set +e

          git fetch origin main
          git reset --hard origin/main

          diagnostic=.lock-hud-diagnostic.txt
          : > "$diagnostic"
          echo "run_id=$GITHUB_RUN_ID" >> "$diagnostic"

          python3 -m py_compile .lock-hud-fix/apply.py >> "$diagnostic" 2>&1
          pycompile_status=$?
          echo "pycompile_status=$pycompile_status" >> "$diagnostic"

          patch_status=99
          if [ "$pycompile_status" -eq 0 ]; then
            python3 .lock-hud-fix/apply.py >> "$diagnostic" 2>&1
            patch_status=$?
          fi
          echo "patch_status=$patch_status" >> "$diagnostic"

          node_status=99
          diff_status=99
          if [ "$patch_status" -eq 0 ]; then
            node --check /tmp/sortie-game.mjs >> "$diagnostic" 2>&1
            node_status=$?
            git diff --check >> "$diagnostic" 2>&1
            diff_status=$?
          fi
          echo "node_status=$node_status" >> "$diagnostic"
          echo "diff_status=$diff_status" >> "$diagnostic"

          if [ "$pycompile_status" -eq 0 ] && [ "$patch_status" -eq 0 ] &&
             [ "$node_status" -eq 0 ] && [ "$diff_status" -eq 0 ]; then
            rm -rf .lock-hud-fix
            rm -f "$diagnostic"
            rm -f .github/workflows/strengthen-lock-and-hud-view.yml

            git config user.name "OpenAI"
            git config user.email "noreply@openai.com"
            git add -A
            git diff --cached --check

            python3 - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines())
          expected = {
              "index.html",
              ".github/workflows/strengthen-lock-and-hud-view.yml",
              ".lock-hud-fix/apply.py",
              ".lock-hud-diagnostic.txt",
          }
          if changed != expected:
              raise SystemExit(f"unexpected staged files: {sorted(changed)}")
          PY

            git commit -m "Strengthen lock-on and add HUD-only view"
            git push origin HEAD:main
            exit 0
          fi

          git checkout -- index.html 2>/dev/null || true
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add "$diagnostic"
          git commit --allow-empty -m "Record lock-on and HUD view diagnostics"
          git push origin HEAD:main
          cat "$diagnostic"
          exit 1
