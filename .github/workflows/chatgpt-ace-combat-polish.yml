name: Apply Ace-combat polish

on:
  push:
    branches:
      - chatgpt/ace-combat-polish
    paths:
      - .github/workflows/chatgpt-ace-combat-polish.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-ace-combat-polish
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ace-combat-polish
          fetch-depth: 0

      - name: Apply deterministic source fixes
        run: python tools/chatgpt_ace_combat_polish_patch.py

      - name: Inline the r07 mission extension
        shell: bash
        run: |
          if grep -q '@payload:ace_combat_polish' index.html; then
            echo 'ace_combat_polish is already inlined'
          else
            node tools/inline_payload.mjs payloads/ace_combat_polish.payload.js
          fi

      - name: Static checks
        shell: bash
        run: |
          node --check src/combat/player-gun.js
          node --check payloads/ace_combat_polish.payload.js
          git diff --check

      - name: Remove integration scaffolding
        run: git rm tools/chatgpt_ace_combat_polish_patch.py .github/workflows/chatgpt-ace-combat-polish.yml

      - name: Commit and push the integrated result
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html src/combat/player-gun.js styles/hud-polish.css payloads/ace_combat_polish.payload.js
          git commit -m 'Fix gun edge cases and make r07 a real escort'
          git push origin HEAD:chatgpt/ace-combat-polish
