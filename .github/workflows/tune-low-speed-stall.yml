name: Tune low-speed handling and stall envelope

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".sortie-tune/ready"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply tuning and run regressions
        shell: bash
        run: |
          set +e
          diagnostic=.sortie-tune/diagnostic.txt
          : > "$diagnostic"

          python3 .sortie-tune/apply_tuning.py >> "$diagnostic" 2>&1
          patch_status=$?
          echo "patch_status=$patch_status" >> "$diagnostic"

          if [ "$patch_status" -eq 0 ]; then
            python3 - <<'PY' >> "$diagnostic" 2>&1
          from pathlib import Path
          import re

          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one module script, found {len(scripts)}")
          Path("/tmp/sortie-game.mjs").write_text(scripts[0], encoding="utf-8")

          required = [
              "const BRAKE_SPEED = 128;",
              "const BRAKE_HIGH_G_SPEED_DROP = 52;",
              "const STALL_WARNING_SPEED = 96;",
              "const STALL_ENTRY_SPEED = 84;",
              "const STALL_DEEP_SPEED = 62;",
              "const STALL_RECOVERY_SPEED = 114;",
              "const brakeTargetSpeed = BRAKE_SPEED - BRAKE_HIGH_G_SPEED_DROP * highGBrakeLoad;",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing tuning marker: {marker}")
          if "const BRAKE_SPEED = 52;" in text:
              raise SystemExit("old unsafe brake target remains")
          PY
            static_status=$?
          else
            static_status=99
          fi
          echo "static_status=$static_status" >> "$diagnostic"

          if [ "$static_status" -eq 0 ]; then
            node --check /tmp/sortie-game.mjs >> "$diagnostic" 2>&1
            node_status=$?
          else
            node_status=99
          fi
          echo "node_status=$node_status" >> "$diagnostic"

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome_bin=$chrome_bin" >> "$diagnostic"

          if [ "$node_status" -eq 0 ] && [ -n "$chrome_bin" ]; then
            npm install --prefix .sortie-tune --no-package-lock --no-save playwright-core@1.54.1 >> "$diagnostic" 2>&1
            npm_status=$?
          else
            npm_status=99
          fi
          echo "npm_status=$npm_status" >> "$diagnostic"

          browser_status=99
          if [ "$npm_status" -eq 0 ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sortie-tune-server.log 2>&1 &
            server_pid=$!
            sleep 1
            CHROME_BIN="$chrome_bin" node .sortie-tune/browser_test.mjs >> "$diagnostic" 2>&1
            browser_status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo "--- server log ---" >> "$diagnostic"
            cat /tmp/sortie-tune-server.log >> "$diagnostic" 2>&1
          fi
          echo "browser_status=$browser_status" >> "$diagnostic"

          rm -rf .sortie-tune/node_modules
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"

          if [ "$patch_status" -eq 0 ] && [ "$static_status" -eq 0 ] && [ "$node_status" -eq 0 ] && [ "$npm_status" -eq 0 ] && [ "$browser_status" -eq 0 ]; then
            rm -rf .sortie-tune
            rm -f .github/workflows/tune-low-speed-stall.yml
            git add -A
            git diff --cached --check
            git commit -m "Tune low-speed handling and stall envelope"
            git push origin HEAD:main
            exit 0
          fi

          git checkout -- index.html 2>/dev/null || true
          git add "$diagnostic"
          git commit -m "Record low-speed handling diagnostics"
          git push origin HEAD:main
          cat "$diagnostic"
          exit 1
