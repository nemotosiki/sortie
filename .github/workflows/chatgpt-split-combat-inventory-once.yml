name: split-combat one-shot inventory

on:
  push:
    branches:
      - chatgpt/split-combat
    paths:
      - .github/workflows/chatgpt-split-combat-inventory-once.yml

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/split-combat
          fetch-depth: 0

      - name: Extract exact combat source and dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          path = root / 'index.html'
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          out = []
          def heading(title):
              out.extend(['', '=' * 92, title, '=' * 92])

          def emit_range(start, end):
              for i in range(max(1, start), min(len(lines), end) + 1):
                  out.append(f'{i:05d}: {lines[i-1]}')

          def find_line(pattern):
              rx = re.compile(pattern)
              hits = [i + 1 for i, line in enumerate(lines) if rx.search(line)]
              return hits

          def extract_function(name):
              rx = re.compile(rf'^\s*(?:async\s+)?function\s+{re.escape(name)}\s*\(')
              starts = [i for i, line in enumerate(lines) if rx.search(line)]
              heading(f'FUNCTION {name} hits={len(starts)}')
              for start in starts:
                  brace = 0
                  seen = False
                  end = start
                  for j in range(start, len(lines)):
                      line = lines[j]
                      # Source contains no template-literal braces in the target signatures
                      # that can end the function early; counting braces linearly is enough
                      # for an inventory and the resulting source is syntax-checked later.
                      brace += line.count('{') - line.count('}')
                      if '{' in line:
                          seen = True
                      end = j
                      if seen and brace == 0:
                          break
                  emit_range(start + 1, end + 1)
                  out.append('-----')

          heading('FILE')
          out.append(f'index.html lines: {len(lines)}')

          heading('IMPORT AND EARLY COMBAT CONSTANT REGION')
          emit_range(2480, 2870)

          # Exact functions likely to be moved or used by the moved code.
          functions = [
              'gunAssistCap', 'gunAssistStep', 'gimbalDecision',
              'gunMuzzleOrigin', 'gunLeadPoint', 'gunAimForgiveness',
              'enemyHitSphereRadius', 'fireGun', 'updateGunsight',
              'updateGunAssist', 'updateBoresight',
              'launchMissile', 'updateMissiles', 'proximityFuseFor',
              'sweptMissDistance', 'ballisticPoint', 'missileTargetPoint',
              'targetAimPoint', 'targetPosition', 'forwardOf', 'rightOf', 'upOf'
          ]
          for name in functions:
              extract_function(name)

          heading('STATE AND DEBUG OCCURRENCES')
          identifiers = [
              'GUN_DAMAGE', 'GUN_GROUND_BONUS', 'GUN_RANGE', 'GUN_RATE',
              'GUN_MUZZLE_SPEED', 'GUN_GIMBAL_DEG', 'GUN_GIMBAL_STRENGTH',
              'GUN_ASSIST_FAR', 'GUN_ASSIST_TAU_RISE', 'GUN_ASSIST_TAU_FALL',
              'gunAssist', 'lastGimbal', 'gunsightState', 'gunCooldown',
              'gunFireCooldown', 'gunShots', 'gunMuzzleOrigin', 'gunLeadPoint',
              'gunAimForgiveness', 'gimbalDecision', 'gunAssistStep',
              'POPUP_DIVE_RATIO', 'POPUP_MIN_DROP', 'proximityFuseFor',
              'sweptMissDistance', 'ballisticPoint', 'missilesInFlight',
              'missile.diving', 'missile.closing', 'missile.lost', 'missile.spw',
              'updateMissiles', 'launchMissile', 'tmpSwept', 'raycaster.far'
          ]
          for ident in identifiers:
              hits = [i + 1 for i, line in enumerate(lines) if ident in line]
              out.append(f'{ident}: count={len(hits)} lines={hits}')
              for i in hits:
                  emit_range(i - 2, i + 2)
                  out.append('-----')

          heading('DEBUG HOOK REGIONS')
          debug_names = [
              'gimbalProbe', 'gunAssistProbe', 'gunAssistCapAt', 'gunAssistSim',
              'gimbalEval', 'gunsightProbe', 'gunHitTest', 'boresightProbe',
              'gunForgivenessAt', 'gunLeadProbe', 'missileProbe'
          ]
          for name in debug_names:
              hits = find_line(re.escape(name) + r'\s*:')
              out.append(f'{name}: {hits}')
              for i in hits:
                  emit_range(i - 4, i + 24)
                  out.append('-----')

          heading('PLAYER GUN CALL SITES')
          for token in ['fireGun()', 'updateGunsight(', 'updateMissiles(', 'gunAssistStep(']:
              hits = [i + 1 for i, line in enumerate(lines) if token in line]
              out.append(f'{token}: {hits}')
              for i in hits:
                  emit_range(i - 3, i + 4)
                  out.append('-----')

          (root / 'tmp_combat_inventory.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit inventory and remove the temporary workflow
        shell: bash
        run: |
          rm .github/workflows/chatgpt-split-combat-inventory-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_combat_inventory.txt
          git add -u .github/workflows
          git commit -m "Record combat extraction inventory"
          git push origin HEAD:chatgpt/split-combat
