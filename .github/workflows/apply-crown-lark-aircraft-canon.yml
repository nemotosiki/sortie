name: Apply CROWN and LARK aircraft canon

on:
  push:
    branches:
      - chatgpt/story-campaign-reboot
    paths:
      - tools/apply_crown_lark_aircraft_canon.py
      - .github/workflows/apply-crown-lark-aircraft-canon.yml

permissions:
  contents: write

concurrency:
  group: apply-crown-lark-aircraft-canon
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/story-campaign-reboot
          fetch-depth: 0

      - name: Apply aircraft canon documentation
        run: python tools/apply_crown_lark_aircraft_canon.py

      - name: Verify documentation contracts
        shell: bash
        run: |
          grep -F 'M19 | TRUST FALL | **F-15Cで限定復帰** | **F-15E**' docs/story_reboot/v0.15/03_crown_lark_aircraft_canon.md
          grep -F 'M20 | THE GUARANTOR | **F-15C** | **F-15E**' docs/story_reboot/v0.15/03_crown_lark_aircraft_canon.md
          grep -F 'F/A-18F | 16 | 12 | 12' docs/story_reboot/v0.15/03_crown_lark_aircraft_canon.md
          grep -F 'F-35C | 16 | 12 | 14' docs/story_reboot/v0.15/03_crown_lark_aircraft_canon.md
          grep -F 'CROWN / LARKの正史搭乗機だけはv0.15/03を優先する' docs/story_reboot/v0.7/00_gameplay_progression_arca.md
          grep -F 'CROWNはM06で重傷を負い前線を退く。M19でF-15Cにより**限定復帰**し、M20まで継続出撃する。' docs/story_reboot/v0.15/00_gibor_crown_lark_finale.md
          git diff --check

      - name: Commit canon documentation
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add docs/story_reboot/v0.7/00_gameplay_progression_arca.md \
                  docs/story_reboot/v0.14/01_character_route_implementation_plan.md \
                  docs/story_reboot/v0.15/00_gibor_crown_lark_finale.md \
                  docs/story_reboot/v0.15/03_crown_lark_aircraft_canon.md
          git rm tools/apply_crown_lark_aircraft_canon.py .github/workflows/apply-crown-lark-aircraft-canon.yml
          git commit -m 'Fix CROWN and LARK canonical aircraft plan'
          git push origin HEAD:chatgpt/story-campaign-reboot
