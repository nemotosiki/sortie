name: Gate target arrow behind hold input

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".sortie-arrow-hold/ready"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply arrow gating and run regressions
        shell: bash
        run: |
          set -euo pipefail

          python3 .sortie-arrow-hold/apply_update.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one module script, found {len(scripts)}")
          Path("/tmp/sortie-game.mjs").write_text(scripts[0], encoding="utf-8")

          required = [
              "const directionHeld = cameraKeyHold.pressed || gamepadInput.previousTarget;",
              "if (!directionHeld) {",
              "clearTargetDirectionArrow();",
              "function updateTargetDirectionArrow()",
              "function updateEnemyHudMarkers()",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing target-arrow hold marker: {marker}")
          PY

          node --check /tmp/sortie-game.mjs

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$chrome_bin" ]; then
            echo "Chrome/Chromium is required for the regression" >&2
            exit 1
          fi

          npm install --prefix .sortie-arrow-hold --no-package-lock --no-save playwright-core@1.54.1

          server_pid=""
          cleanup_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_server EXIT

          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sortie-arrow-hold-server.log 2>&1 &
          server_pid=$!
          sleep 1
          CHROME_BIN="$chrome_bin" node .sortie-arrow-hold/browser_test.mjs
          cleanup_server
          server_pid=""
          trap - EXIT

          rm -rf .sortie-arrow-hold/node_modules
          rm -rf .sortie-arrow-hold
          rm -f .github/workflows/target-arrow-hold.yml

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "Show target arrow only while holding target view"
          git push origin HEAD:main
