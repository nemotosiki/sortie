name: split-combat one-shot detail inventory

on:
  push:
    branches:
      - chatgpt/split-combat
    paths:
      - .github/workflows/chatgpt-split-combat-detail-once.yml

permissions:
  contents: write

jobs:
  detail:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/split-combat
          fetch-depth: 0

      - name: Capture exact integration ranges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          lines = Path('index.html').read_text(encoding='utf-8').splitlines()
          out = []

          def section(title, start, end):
              out.extend(['', '=' * 90, title, '=' * 90])
              for i in range(start, end + 1):
                  out.append(f'{i:05d}: {lines[i-1]}')

          def function(name):
              rx = re.compile(rf'^\s*(?:async\s+)?function\s+{re.escape(name)}\s*\(')
              starts = [i for i, line in enumerate(lines) if rx.search(line)]
              out.extend(['', '=' * 90, f'FUNCTION {name} hits={len(starts)}', '=' * 90])
              for start in starts:
                  depth = 0
                  seen = False
                  for end in range(start, len(lines)):
                      line = lines[end]
                      depth += line.count('{') - line.count('}')
                      seen = seen or '{' in line
                      if seen and depth == 0:
                          break
                  for i in range(start + 1, end + 2):
                      out.append(f'{i:05d}: {lines[i-1]}')
                  out.append('-----')

          section('MISSILE CONSTANTS AND RUNTIME STATE', 15020, 15230)
          section('GUNSIGHT STATE AND DEBUG OBJECT CONTEXT', 15040, 16170)
          section('FIRE INPUT AND PLAYER WEAPON UPDATE', 19090, 19380)
          section('MISSILE UPDATE THROUGH BOMB HELPERS', 19350, 19820)
          section('GUNSIGHT / BORESIGHT / RADIO NEIGHBOURHOOD', 26260, 26520)
          section('DEBUG SYNC AND LOADOUT APPLICATION', 26960, 27120)
          section('AIRCRAFT LOADOUT ASSIGNMENTS', 30470, 30560)

          for name in [
              'launchSpw', 'fireWeapon', 'updatePlayerWeapons', 'updateMissileReload',
              'removeMissile', 'ciwsIntercept', 'damping', 'isHudProjectionVisible'
          ]:
              function(name)

          tokens = [
              'MISSILE_TURN_RATE', 'MISSILE_MAX_SPEED', 'MISSILE_FUSE',
              'MISSILE_TERMINAL_RANGE', 'MISSILE_TERMINAL_SUBSTEPS',
              'SEEKER_LOSS_TIME', 'POPUP_DIVE_RATIO', 'POPUP_MIN_DROP',
              'GUNSIGHT_CONE_DEG', 'GUNSIGHT_CONE_COS', 'ENEMY_HITBOX_RADIUS',
              'gunsightState', 'gunCooldown', 'GUN_RATE', 'GUN_RANGE'
          ]
          out.extend(['', '=' * 90, 'TOKEN DEFINITIONS / OCCURRENCES', '=' * 90])
          for token in tokens:
              hits = [i + 1 for i, line in enumerate(lines) if token in line]
              out.append(f'{token}: {hits}')

          Path('tmp_combat_detail.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit detail inventory and remove workflow
        shell: bash
        run: |
          rm .github/workflows/chatgpt-split-combat-detail-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_combat_detail.txt
          git add -u .github/workflows
          git commit -m "Record combat integration details"
          git push origin HEAD:chatgpt/split-combat
