name: Verify Sera M02 foundation

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - payloads/map_amalPlain.payload.js
      - payloads/mission_sera_m02.payload.js
      - tools/check_map_amal_plain.mjs
      - tools/check_sera_m02_payload.mjs
      - .github/workflows/verify-sera-m02-foundation.yml

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Amal Plain and M02 mission contracts
        run: |
          node tools/check_map_amal_plain.mjs
          node tools/check_sera_m02_payload.mjs
          node tools/check_sera_m01_payload.mjs
          node tools/check_map_ren_bay.mjs
          node tools/check_air_iff_foundation.mjs
          git diff --check
