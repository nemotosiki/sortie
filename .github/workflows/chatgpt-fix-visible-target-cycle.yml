name: Fix visible target cycling and surface hex markers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-fix-visible-target-cycle.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-fix-visible-target-cycle
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply strict on-screen selection and hex surface markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')

          old_visibility = '''    function visibleTargetCycleEntry(enemy) {
      // Manual target selection should follow what the pilot can actually see.
      // Reuse the HUD contact projection and its small edge tolerance so a
      // contact whose marker is visible is also selectable with Triangle/Tab.
      const point = enemyAimPoint(enemy, tmpHudWorld);
      const projected = projectWorldToScreen(point);
      const inFront = projected.ndcZ > -1 && projected.ndcZ < 1;
      const onScreen =
        inFront &&
        Math.abs(projected.ndcX) <= 1.08 &&
        Math.abs(projected.ndcY) <= 1.08;
      if (!onScreen) return null;

      return {
        enemy,
        centerDistSq:
          projected.ndcX * projected.ndcX + projected.ndcY * projected.ndcY,
      };
    }
'''
          new_visibility = '''    function visibleTargetCycleEntry(enemy) {
      // Triangle/Tab must use the actual camera viewport, not the HUD's loose
      // draw margin. A strict 1.0 NDC limit excludes contacts outside the image.
      const point = enemyAimPoint(enemy, tmpHudWorld);
      tmpV6.copy(point).applyMatrix4(camera.matrixWorldInverse);
      tmpV7.copy(point).project(camera);
      if (!isHudProjectionVisible(tmpV7, tmpV6, 1.0)) return null;

      return {
        enemy,
        centerDistSq: tmpV7.x * tmpV7.x + tmpV7.y * tmpV7.y,
      };
    }
'''
          if text.count(old_visibility) != 1:
              raise RuntimeError('visibleTargetCycleEntry source did not match exactly once')
          text = text.replace(old_visibility, new_visibility, 1)

          old_cycle = '''    function cycleTarget() {
      if (gameState !== STATE_PLAYING) return;
      // Ship turrets/VLS remain HUD contacts and destructible records, but
      // Triangle/Tab treats each vessel as one target: its hull record.
      const alive = enemies.filter((enemy) => enemy.alive && !enemy.subsystem);
      if (alive.length === 0) return;

      const visible = alive
        .map(visibleTargetCycleEntry)
        .filter(Boolean)
        .sort((a, b) => {
          const centerDelta = a.centerDistSq - b.centerDistSq;
          if (Math.abs(centerDelta) > 1e-9) return centerDelta;
          return targetCycleKey(a.enemy) - targetCycleKey(b.enemy);
        });

      // Ace Combat-style priority: while any contact is visible, Triangle/Tab
      // stays on visible contacts and steps from the centre of the view outward.
      // If the sky in front is empty, retain the legacy all-contact fallback so
      // radar-guided searching still works instead of making the key a no-op.
      const candidates = visible.length > 0
        ? visible.map((entry) => entry.enemy)
        : alive.slice().sort((a, b) => targetCycleKey(a) - targetCycleKey(b));

      const currentId = preferredTargetId ?? lock.targetId;
      const currentIndex = candidates.findIndex((enemy) => enemy.id === currentId);
      const next = candidates[(currentIndex + 1 + candidates.length) % candidates.length];
      preferredTargetId = next.id;
      lock.targetId = next.id;
      lock.progress = 0;
      lock.locked = false;
      // A mount has no meaningful number to read out - it is "the VLS on that
      // ship" - so it announces itself by name instead.
    }
'''
          new_cycle = '''    function cycleTarget() {
      if (gameState !== STATE_PLAYING) return;

      // Manual cycling is screen-local: every live HUD contact whose aim point
      // is inside the current camera image is eligible, including ship mounts.
      const candidates = enemies
        .filter((enemy) => enemy.alive)
        .map(visibleTargetCycleEntry)
        .filter(Boolean)
        .sort((a, b) => {
          const centerDelta = a.centerDistSq - b.centerDistSq;
          if (Math.abs(centerDelta) > 1e-9) return centerDelta;
          return targetCycleKey(a.enemy) - targetCycleKey(b.enemy);
        })
        .map((entry) => entry.enemy);

      // Never fall back to radar/off-screen contacts. With nothing visible the
      // target key is deliberately a no-op rather than selecting what was not seen.
      if (candidates.length === 0) return;

      const currentId = preferredTargetId ?? lock.targetId;
      const currentIndex = candidates.findIndex((enemy) => enemy.id === currentId);
      const next = candidates[(currentIndex + 1 + candidates.length) % candidates.length];
      preferredTargetId = next.id;
      lock.targetId = next.id;
      lock.progress = 0;
      lock.locked = false;
      // A mount has no meaningful number to read out - it is "the VLS on that
      // ship" - so it announces itself by name instead.
    }
'''
          if text.count(old_cycle) != 1:
              raise RuntimeError('cycleTarget source did not match exactly once')
          text = text.replace(old_cycle, new_cycle, 1)

          old_can_lock = '''    function canLock(enemy, lockKind) {
      // Subsystems stay visible/destructible, but seekers acquire the vessel
      // hull only. This also keeps single- and multi-lock weapons consistent.
      if (!enemy || enemy.subsystem) return false;
'''
          new_can_lock = '''    function canLock(enemy, lockKind) {
      if (!enemy) return false;
'''
          if text.count(old_can_lock) != 1:
              raise RuntimeError('canLock subsystem exclusion did not match exactly once')
          text = text.replace(old_can_lock, new_can_lock, 1)

          old_loop = '''      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        if (!canLock(enemy, lockKind)) continue;
        tmpV2.copy(enemy.group.position).sub(player.position);
'''
          new_loop = '''      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        if (!canLock(enemy, lockKind)) continue;
        // Ship mounts are manual targets only: Triangle/Tab can nominate one,
        // but the seeker will never pull an unselected mount out of the scene.
        const manuallySelectedSubsystem = Boolean(
          enemy.subsystem && preferred && enemy.id === preferred.id
        );
        if (enemy.subsystem && !manuallySelectedSubsystem) continue;
        tmpV2.copy(enemy.group.position).sub(player.position);
'''
          if text.count(old_loop) != 1:
              raise RuntimeError('updateLock loop source did not match exactly once')
          text = text.replace(old_loop, new_loop, 1)

          old_marker = '''        // AC-style surface target frame: land units and ship hulls are hexagons.
        // Ship subsystems stay square display-only contacts, as requested.
        marker.classList.toggle(
          "ground",
          Boolean(enemy.ground || (enemy.surface && !enemy.subsystem))
        );
'''
          new_marker = '''        // Every surface contact uses the hexagonal frame: land targets,
        // ship hulls, turrets, VLS and CIWS subsystem records.
        marker.classList.toggle(
          "ground",
          Boolean(enemy.ground || enemy.surface)
        );
'''
          if text.count(old_marker) != 1:
              raise RuntimeError('surface marker class source did not match exactly once')
          text = text.replace(old_marker, new_marker, 1)

          cycle_match = re.search(
              r'    function cycleTarget\(\) \{(?P<body>.*?)\n    \}\n\n    function cycleCamera',
              text,
              re.DOTALL,
          )
          if not cycle_match:
              raise RuntimeError('could not re-read cycleTarget after patch')
          cycle_body = cycle_match.group('body')
          forbidden = (
              'alive.slice()',
              'visible.length > 0',
              'enemy.alive && !enemy.subsystem',
              '1.08',
          )
          for needle in forbidden:
              if needle in cycle_body:
                  raise RuntimeError(f'off-screen/subsystem fallback remains: {needle}')
          required = (
              'isHudProjectionVisible(tmpV7, tmpV6, 1.0)',
              '.filter((enemy) => enemy.alive)',
              'if (candidates.length === 0) return;',
              'Boolean(enemy.ground || enemy.surface)',
              'manuallySelectedSubsystem',
          )
          for needle in required:
              if needle not in text:
                  raise RuntimeError(f'missing patched source: {needle}')

          module = re.search(r'<script type="module">\n(?P<body>.*)\n  </script>', text, re.DOTALL)
          if not module:
              raise RuntimeError('could not extract index module')
          with tempfile.TemporaryDirectory() as temp_dir:
              module_path = Path(temp_dir) / 'index-module.mjs'
              module_path.write_text(module.group('body'), encoding='utf-8', newline='\n')
              subprocess.run(['node', '--check', str(module_path)], check=True)

          index_path.write_text(text, encoding='utf-8', newline='\n')

          css_path = Path('styles/hud-polish.css')
          css = css_path.read_text(encoding='utf-8')
          old_css_comment = '''/* The HUD uses this same marker node for normal, selected and locked
   contacts, so the hexagon persists through every state. JS applies this class
   to land targets and ship hulls; ship subsystems deliberately remain square. */'''
          new_css_comment = '''/* Land targets, ship hulls and ship subsystems share this marker class.
   The HUD reuses one node for normal, selected and locked states, so the
   hexagonal frame persists through every state. */'''
          if css.count(old_css_comment) != 1:
              raise RuntimeError('surface hex CSS comment did not match exactly once')
          css = css.replace(old_css_comment, new_css_comment, 1)
          css_path.write_text(css, encoding='utf-8', newline='\n')

          print('strict visible cycling and surface hex markers applied')
          PY

      - name: Static checks
        run: git diff --check

      - name: Remove integration workflow
        run: git rm .github/workflows/chatgpt-fix-visible-target-cycle.yml

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html styles/hud-polish.css
          git commit -m 'Fix strict visible target cycling and hex ship subsystems'
          git push origin HEAD:main
