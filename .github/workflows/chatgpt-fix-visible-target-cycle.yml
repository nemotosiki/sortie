name: Fix visible target cycling and surface hex markers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-fix-visible-target-cycle.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-fix-visible-target-cycle
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply strict on-screen selection and hex surface markers
        run: python .github/chatgpt/apply_visible_target_fix.py

      - name: Static checks
        run: git diff --check

      - name: Remove one-shot integration files
        run: git rm .github/workflows/chatgpt-fix-visible-target-cycle.yml .github/chatgpt/apply_visible_target_fix.py

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html styles/hud-polish.css
          git commit -m 'Fix strict visible target cycling and hex ship subsystems'
          git push origin HEAD:main
