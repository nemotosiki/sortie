name: Apply multirole mobility tuning

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/apply_multirole_mobility_tune.py
      - .github/workflows/apply-multirole-mobility-tune.yml

permissions:
  contents: write

concurrency:
  group: apply-multirole-mobility-tune
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Apply multirole mobility tuning
        run: python tools/apply_multirole_mobility_tune.py

      - name: Run static regression contracts
        run: |
          node tools/check_multirole_mobility_balance.mjs
          node tools/check_fa18f_spw_select.mjs
          node tools/check_legacy_airframe_variants.mjs
          node tools/check_air_iff_foundation.mjs
          node tools/check_map_ren_bay.mjs
          node tools/check_sera_m01_payload.mjs
          git diff --check

      - name: Install Chromium harness
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run browser and registry gates
        shell: bash
        run: |
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/check_fa18f_spw_select_browser.mjs
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs

      - name: Commit multirole mobility tuning
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html tools/check_multirole_mobility_balance.mjs
          git rm tools/apply_multirole_mobility_tune.py .github/workflows/apply-multirole-mobility-tune.yml
          git commit -m 'Tune multirole aircraft mobility'
          git push origin HEAD:chatgpt/sera-act1-implementation
