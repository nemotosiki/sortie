      if (gameState === STATE_READY) {
        if (dpadLeftPressed && !gamepadInput.previousCycleLeft) cycleAircraft(-1);
        if (dpadRightPressed && !gamepadInput.previousCycleRight) cycleAircraft(1);
      }
''',
