          replace_once(
              '        aceDestroyed: false,\n        forceDamageEnemy:',
              '        aceDestroyed: false,\n        forceSelectAircraft: (id) => selectAircraft(id),\n        forceDamageEnemy:',
              'force select aircraft hook',
          )

          # Player model is now data-driven and replaceable.
          old_player_model = '''    const player = new THREE.Group();
    const playerModel = createAircraftModel({
      primary: 0xe6fbff,
