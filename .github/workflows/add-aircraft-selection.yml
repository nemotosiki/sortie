          replace_once('    syncGameHook();\n\n    ui.startBtn.addEventListener', '    syncGameHook();\n    renderAircraftCards();\n\n    ui.startBtn.addEventListener', 'initial aircraft card render')
          replace_once(
              '''    ui.retryBtn.addEventListener("click", () => {
      ensureAudio();
      startMission();
    });
''',
              '''    ui.retryBtn.addEventListener("click", () => {
      ensureAudio();
      startMission();
    });
    ui.changeAircraftBtn.addEventListener("click", () => {
      ensureAudio();
      setState(STATE_READY);
    });
''',
              'change aircraft listener',
          )

          # Ready-screen keyboard selection.
          replace_once(
              '      if (event.code === "Enter" && !event.repeat) {',
              '''      if ((event.code === "ArrowLeft" || event.code === "KeyA") &&
          !event.repeat && gameState === STATE_READY) {
