name: Add selectable player aircraft

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".aircraft-selection-ready"

permissions:
  contents: write

concurrency:
  group: add-aircraft-selection
  cancel-in-progress: true

jobs:
  patch-static-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply aircraft selection, validate, clean up, and publish
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              text = text.replace(old, new, 1)

          # CSS: aircraft picker, cards, secondary result action, and mobile layout.
          css_block = '''    .aircraftSelect { margin: 16px 0 20px; text-align: left; }

    .aircraftSelectHeader {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .aircraftSelectHint {
      font-size: 10px;
      letter-spacing: 0.14em;
      color: rgba(220, 247, 255, 0.5);
    }

    .aircraftCardRow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .aircraftCard {
      position: relative;
      text-align: left;
      padding: 12px;
      border: 1px solid rgba(143, 239, 255, 0.2);
      background: rgba(32, 119, 145, 0.08);
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .aircraftCard:hover,
    .aircraftCard:focus-visible {
      border-color: rgba(167, 246, 255, 0.55);
      background: rgba(83, 217, 239, 0.14);
    }

    .aircraftCard.active {
      border-color: #a7f6ff;
      background: rgba(83, 217, 239, 0.2);
      box-shadow: 0 0 18px rgba(106, 232, 255, 0.28), inset 0 0 18px rgba(83, 217, 239, 0.1);
    }

    .aircraftTag {
      display: inline-block;
      margin-bottom: 4px;
      padding: 2px 6px;
      font-size: 9px;
      letter-spacing: 0.12em;
      border: 1px solid var(--warning);
      color: var(--warning);
    }

    .aircraftName {
      display: block;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #ecfdff;
    }

    .aircraftRole {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #a8f4ff;
    }

    .aircraftBlurb {
      margin: 8px 0;
      min-height: 4.4em;
      font-size: 10.5px;
      line-height: 1.5;
      color: rgba(220, 247, 255, 0.7);
    }

    .statRow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: rgba(220, 247, 255, 0.5);
    }

    .statRow span:first-child { width: 34px; flex-shrink: 0; }
    .aircraftStatBar { flex: 1; height: 5px; }

    .aircraftMissiles {
      display: block;
      margin-top: 6px;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: rgba(220, 247, 255, 0.55);
    }

    .actionButton.secondary {
      min-width: 0;
      margin-top: 12px;
      padding: 10px 22px;
      border-color: rgba(143, 239, 255, 0.35);
      background: rgba(83, 217, 239, 0.04);
      font-size: 11px;
    }

'''
          replace_once('    .controls {\n', css_block + '    .controls {\n', 'aircraft picker CSS anchor')
          replace_once(
              '      .controls { grid-template-columns: 1fr 1fr; }\n',
              '      .controls { grid-template-columns: 1fr 1fr; }\n      .aircraftCardRow { grid-template-columns: 1fr 1fr; }\n',
              'mobile aircraft cards',
          )

          # HTML: picker, help item, and result-screen return action.
