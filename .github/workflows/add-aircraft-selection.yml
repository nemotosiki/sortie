          replace_once(
              '        <div class="controlItem"><strong>C KEY</strong><span>短押しでカメラ切替、長押し中はロック対象を注視。HPを保ち全機撃墜せよ。</span></div>',
              '        <div class="controlItem"><strong>A/D · ←/→ · D-PAD</strong><span>スタート画面で機体を切替。</span></div>\n        <div class="controlItem"><strong>C KEY</strong><span>短押しでカメラ切替、長押し中はロック対象を注視。HPを保ち全機撃墜せよ。</span></div>',
