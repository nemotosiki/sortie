          aircraft_functions = '''

    function rebuildPlayerModel(id) {
      if (gameState === STATE_PLAYING) return;
      const spec = AIRCRAFT_TYPES[id] || AIRCRAFT_TYPES[DEFAULT_AIRCRAFT_ID];
      player.remove(playerModel.group);
      disposeAircraftMaterials(playerModel);
      playerModel = createAircraftModel(spec.theme);
      player.add(playerModel.group);
      playerModel.group.visible = cameraMode !== "cockpit";
    }

    function applyAircraftLoadout(id) {
      const spec = AIRCRAFT_TYPES[id] || AIRCRAFT_TYPES[DEFAULT_AIRCRAFT_ID];
      selectedAircraftId = spec.id;
      CRUISE_SPEED = spec.cruiseSpeed;
      BOOST_SPEED = spec.boostSpeed;
      BRAKE_SPEED = spec.brakeSpeed;
      PITCH_RATE = THREE.MathUtils.degToRad(spec.pitchRateDeg);
      EXPERT_ROLL_RATE = THREE.MathUtils.degToRad(spec.rollRateDeg);
      YAW_RATE = THREE.MathUtils.degToRad(spec.yawRateDeg);
      MAX_BANK_ANGLE = THREE.MathUtils.degToRad(spec.maxBankAngleDeg);
      NORMAL_ROLL_SPRING = spec.normalRollSpring;
      NORMAL_ROLL_RATE_LIMIT = THREE.MathUtils.degToRad(spec.rollRateLimitDeg);
      COORDINATED_TURN_RATE = THREE.MathUtils.degToRad(spec.turnRateDeg);
      PLAYER_MISSILE_CAPACITY = spec.missileCapacity;
      PLAYER_MAX_HEALTH = spec.maxHealth;
      rebuildPlayerModel(spec.id);
    }

    function selectAircraft(id) {
      if (gameState === STATE_PLAYING) return false;
      if (!AIRCRAFT_TYPES[id]) return false;
      selectedAircraftId = id;
      rebuildPlayerModel(id);
      updateAircraftCardsUI();
      window.__game.selectedAircraft = selectedAircraftId;
      return true;
    }

    function cycleAircraft(delta) {
      const idx = AIRCRAFT_ORDER.indexOf(selectedAircraftId);
      selectAircraft(AIRCRAFT_ORDER[(idx + delta + AIRCRAFT_ORDER.length) % AIRCRAFT_ORDER.length]);
    }

    function statPercent(value, min, max) {
      if (max === min) return 100;
      return Math.round(20 + ((value - min) / (max - min)) * 80);
    }

    function renderAircraftCards() {
      const specs = AIRCRAFT_ORDER.map((id) => AIRCRAFT_TYPES[id]);
      const speeds = specs.map((spec) => spec.boostSpeed);
      const turns = specs.map((spec) => spec.turnRateDeg);
      const armors = specs.map((spec) => spec.maxHealth);

      ui.aircraftCardRow.replaceChildren(...specs.map((spec) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "aircraftCard";
        card.dataset.aircraft = spec.id;
        card.setAttribute("role", "radio");
        card.setAttribute("aria-checked", String(spec.id === selectedAircraftId));
        const speedPercent = statPercent(spec.boostSpeed, Math.min(...speeds), Math.max(...speeds)) / 100;
        const turnPercent = statPercent(spec.turnRateDeg, Math.min(...turns), Math.max(...turns)) / 100;
        const armorPercent = statPercent(spec.maxHealth, Math.min(...armors), Math.max(...armors)) / 100;
        card.innerHTML = `
          ${spec.tag ? `<span class="aircraftTag">${spec.tag}</span>` : ""}
          <span class="aircraftName">${spec.label}</span>
          <span class="aircraftRole">${spec.role}</span>
          <p class="aircraftBlurb">${spec.blurb}</p>
          <div class="aircraftStats">
            <div class="statRow"><span>SPD</span><div class="bar aircraftStatBar"><span style="transform:scaleX(${speedPercent})"></span></div></div>
