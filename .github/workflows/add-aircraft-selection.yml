        cruiseSpeed: 239, boostSpeed: 385, brakeSpeed: 145,
        pitchRateDeg: 55, rollRateDeg: 83, yawRateDeg: 13, maxBankAngleDeg: 55,
        normalRollSpring: 18, rollRateLimitDeg: 101, turnRateDeg: 34,
        missileCapacity: 6, maxHealth: 105,
        theme: Object.freeze({
