              ('const EXPERT_ROLL_RATE = THREE.MathUtils.degToRad(102);', 'let EXPERT_ROLL_RATE = THREE.MathUtils.degToRad(102);'),
              ('const YAW_RATE = THREE.MathUtils.degToRad(16);', 'let YAW_RATE = THREE.MathUtils.degToRad(16);'),
              ('const MAX_BANK_ANGLE = THREE.MathUtils.degToRad(68);', 'let MAX_BANK_ANGLE = THREE.MathUtils.degToRad(68);'),
              ('const NORMAL_ROLL_SPRING = 22;', 'let NORMAL_ROLL_SPRING = 22;'),
              ('const NORMAL_ROLL_RATE_LIMIT = THREE.MathUtils.degToRad(125);', 'let NORMAL_ROLL_RATE_LIMIT = THREE.MathUtils.degToRad(125);'),
              ('const COORDINATED_TURN_RATE = THREE.MathUtils.degToRad(42);', 'let COORDINATED_TURN_RATE = THREE.MathUtils.degToRad(42);'),
          ]
          for old, new in mutable_constants:
              replace_once(old, new, f'mutable constant {old}')
          replace_once(
              '    let COORDINATED_TURN_RATE = THREE.MathUtils.degToRad(42);\n    const TARGET_FOCUS_HOLD_MS = 360;',
              '    let COORDINATED_TURN_RATE = THREE.MathUtils.degToRad(42);\n    let PLAYER_MAX_HEALTH = 100;\n    const TARGET_FOCUS_HOLD_MS = 360;',
