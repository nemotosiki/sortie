          replace_once('hook.debug.lowHealthSmokeActive = health < 55 && smokeParticlePool.activeCount > 0;', 'hook.debug.lowHealthSmokeActive = health < PLAYER_MAX_HEALTH * 0.55 && smokeParticlePool.activeCount > 0;', 'debug smoke threshold')
          replace_once('if (gameState !== STATE_PLAYING || health >= 55 || !playerModel.group.visible)', 'if (gameState !== STATE_PLAYING || health >= PLAYER_MAX_HEALTH * 0.55 || !playerModel.group.visible)', 'smoke guard threshold')
          replace_once('const severity = THREE.MathUtils.clamp((55 - health) / 45, 0, 1);', 'const severity = THREE.MathUtils.clamp((PLAYER_MAX_HEALTH * 0.55 - health) / (PLAYER_MAX_HEALTH * 0.45), 0, 1);', 'smoke severity ratio')

