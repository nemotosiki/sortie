name: Publish combat feedback with static validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".sortie-feedback/ready-v3"

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply patch, run static checks, and publish
        shell: bash
        run: |
          set -euo pipefail

          python3 .sortie-feedback/apply_update.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          scripts = re.findall(r'<script type="module">(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one module script, found {len(scripts)}")
          Path("/tmp/sortie-game.mjs").write_text(scripts[0], encoding="utf-8")

          required = [
              '"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"',
              '"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"',
              "const BOOST_SPEED_RESPONSE_K = 0.22;",
              "const BRAKE_SPEED_RESPONSE_K = 0.16;",
              "const CRUISE_SPEED_RESPONSE_K = 0.32;",
              "const HIGH_SPEED_FOV_BONUS = 8;",
              "const directionHeld = cameraKeyHold.pressed || cameraKeyHold.focus ||",
              'targetArrowState.mode = "onscreen";',
              "function createParticlePool(capacity, options)",
              "new THREE.Points(bufferGeometry, material)",
              "function createDestroyedPopup(position, label, points)",
              "function updatePlayerDamageSmoke(dt)",
              "hook.debug.activeParticles",
              "hook.debug.activeAudioSources",
              'title.textContent = "DESTROYED";',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"missing required implementation marker: {marker}")

          forbidden = [
              "const BOOST_SPEED_RESPONSE_K = 0.006;",
              "const BRAKE_SPEED_RESPONSE_K = 0.018;",
              "const directionHeld = cameraKeyHold.pressed || gamepadInput.previousTarget;",
              "console.warn(",
              "console.error(",
              "@latest",
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f"obsolete or forbidden implementation remains: {marker}")

          required_ids = [
              "score", "highscore", "health", "missiles", "kills", "state",
              "startBtn", "retryBtn"
          ]
          for element_id in required_ids:
              count = len(re.findall(rf'id=["\']{re.escape(element_id)}["\']', text))
              if count != 1:
                  raise SystemExit(f"expected one #{element_id}, found {count}")

          states = ["ready", "playing", "missionComplete", "gameover"]
          for state in states:
              if f'"{state}"' not in text:
                  raise SystemExit(f"missing state literal: {state}")
          PY

          node --check /tmp/sortie-game.mjs
          git diff --check
          git diff --exit-code --quiet -- index.html && {
            echo "index.html was not changed by the feedback patch" >&2
            exit 1
          }

          rm -rf .sortie-feedback
          rm -f .github/workflows/enhance-combat-feedback.yml
          rm -f .github/workflows/enhance-combat-feedback-v3.yml

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "Enhance combat feedback and speed presentation"
          git push origin HEAD:main
