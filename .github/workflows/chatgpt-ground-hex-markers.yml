name: Apply ground hex target markers

on:
  push:
    branches:
      - agent/target-cycle-screen-priority
    paths:
      - .github/workflows/chatgpt-ground-hex-markers.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-ground-hex-markers
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-cycle-screen-priority
          fetch-depth: 0

      - name: Use hexagon frames for ground contacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')

          # Current HUD uses one .enemyMarker node for ordinary, selected and
          # locked states. Tag only land targets; aircraft and ships stay square.
          marker_anchor = '        marker.classList.toggle("subsystem", Boolean(enemy.subsystem));\n'
          marker_replacement = marker_anchor + '        marker.classList.toggle("ground", Boolean(enemy.ground));\n'
          if text.count(marker_anchor) != 1:
              raise RuntimeError(f'ground marker class anchor count={text.count(marker_anchor)}')
          if 'marker.classList.toggle("ground", Boolean(enemy.ground));' in text:
              raise RuntimeError('ground marker class already exists')
          text = text.replace(marker_anchor, marker_replacement, 1)

          module = re.search(r'<script type="module">\n(?P<body>.*)\n  </script>', text, re.DOTALL)
          if not module:
              raise RuntimeError('could not extract index module')
          with tempfile.TemporaryDirectory() as temp_dir:
              module_path = Path(temp_dir) / 'index-module.mjs'
              module_path.write_text(module.group('body'), encoding='utf-8', newline='\n')
              subprocess.run(['node', '--check', str(module_path)], check=True)

          index_path.write_text(text, encoding='utf-8', newline='\n')

          css_path = Path('styles/hud-polish.css')
          css = css_path.read_text(encoding='utf-8')
          sentinel = '/* Ground contacts use the AC-style flat-top hexagonal target frame. */'
          if sentinel in css:
              raise RuntimeError('ground hex marker CSS already exists')

          css_block = "\n".join([
              '',
              '',
              '/* Ground contacts use the AC-style flat-top hexagonal target frame. */',
              ':root {',
              '  --ground-target-hex-mask: url("data:image/svg+xml,%3Csvg%20xmlns=\'http://www.w3.org/2000/svg\'%20viewBox=\'0%200%20100%20100\'%3E%3Cpolygon%20points=\'25,3%2075,3%2097,50%2075,97%2025,97%203,50\'%20fill=\'none\'%20stroke=\'white\'%20stroke-width=\'5\'%20stroke-linejoin=\'miter\'/%3E%3C/svg%3E");',
              '}',
              '',
              '/* The HUD now uses this same marker node for normal, selected and locked',
              '   contacts, so this single override keeps the hexagon through every state.',
              '   Ships are surface targets but are not `ground`, and therefore stay square. */',
              '.enemyMarker.ground {',
              '  border-color: transparent !important;',
              '}',
              '',
              '.enemyMarker.ground::before {',
              '  inset: 0;',
              '  border: 0;',
              '  opacity: 0.92;',
              '  background: currentColor;',
              '  -webkit-mask-image: var(--ground-target-hex-mask);',
              '  -webkit-mask-repeat: no-repeat;',
              '  -webkit-mask-position: center;',
              '  -webkit-mask-size: 100% 100%;',
              '  mask-image: var(--ground-target-hex-mask);',
              '  mask-repeat: no-repeat;',
              '  mask-position: center;',
              '  mask-size: 100% 100%;',
              '}',
              '',
          ])
          css += css_block
          css_path.write_text(css, encoding='utf-8', newline='\n')

          required = (
              'marker.classList.toggle("ground", Boolean(enemy.ground));',
              '--ground-target-hex-mask:',
              '.enemyMarker.ground::before',
              'enemy.alive && !enemy.subsystem',
              'if (!enemy || enemy.subsystem) return false;',
          )
          combined = text + '\n' + css
          for needle in required:
              if needle not in combined:
                  raise RuntimeError(f'missing expected source: {needle}')
          print('ground hex marker patch applied and index module syntax checked')
          PY

      - name: Static diff check
        run: git diff --check

      - name: Remove integration workflow
        run: git rm .github/workflows/chatgpt-ground-hex-markers.yml

      - name: Commit and push integrated result
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html styles/hud-polish.css
          git commit -m 'Use hexagon HUD markers for ground targets'
          git push origin HEAD:agent/target-cycle-screen-priority
