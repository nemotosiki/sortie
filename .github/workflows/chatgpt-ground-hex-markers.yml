name: Inspect current target box implementation

on:
  push:
    branches:
      - agent/target-cycle-screen-priority
    paths:
      - .github/workflows/chatgpt-ground-hex-markers.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-cycle-screen-priority
          fetch-depth: 1
      - name: Print current target-box code
        shell: bash
        run: |
          grep -n -C 10 -E 'targetBox|targetBoxContactId' index.html | tail -n 260
