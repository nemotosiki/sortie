name: Apply Sera M02 progression fix

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/apply_sera_m02_progression_fix.py
      - tools/fix_sera_m02_e2e_unlock_seed.py
      - .github/workflows/apply-sera-m02-progression-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-sera-m02-progression-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Apply M02 strike, progression and E2E prerequisite fixes
        run: |
          python -m py_compile \
            tools/apply_sera_m02_progression_fix.py \
            tools/fix_sera_m02_e2e_unlock_seed.py
          python tools/apply_sera_m02_progression_fix.py
          python tools/fix_sera_m02_e2e_unlock_seed.py

      - name: Run static contracts
        run: |
          node tools/check_sera_m02_host.mjs
          node tools/check_map_amal_plain.mjs
          node tools/check_sera_m02_payload.mjs
          node tools/check_sera_m01_payload.mjs
          node tools/check_map_ren_bay.mjs
          node tools/check_air_iff_foundation.mjs
          node tools/check_legacy_airframe_variants.mjs
          node tools/check_fa18f_spw_select.mjs
          node tools/check_multirole_mobility_balance.mjs
          node --check tools/check_sera_m02_e2e.mjs
          node --check tools/diagnose_sera_m02_phases.mjs
          git diff --check

      - name: Install Chromium harness
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run registry gates
        shell: bash
        run: |
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs --payloads=payloads/map_amalPlain.payload.js,payloads/mission_sera_m02.payload.js

      - name: Start local game server
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/sortie-http.log 2>&1 &
          echo $! > /tmp/sortie-http.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sortie-http.log
          exit 1

      - name: Verify corrected M02 phases and full E2E
        run: |
          node tools/diagnose_sera_m02_phases.mjs
          node tools/check_sera_m02_e2e.mjs

      - name: Preserve M01 vertical-slice regression
        run: node tools/check_sera_m01_e2e.mjs

      - name: Commit verified progression fix
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html tools/check_sera_m02_host.mjs tools/check_sera_m02_e2e.mjs
          git rm \
            tools/apply_sera_m02_progression_fix.py \
            tools/fix_sera_m02_e2e_unlock_seed.py \
            .github/workflows/apply-sera-m02-progression-fix.yml
          git diff --cached --check
          git commit -m 'Fix Sera M02 strike progression'
          git push origin HEAD:chatgpt/sera-act1-implementation

      - name: Stop local game server
        if: always()
        run: |
          if [ -f /tmp/sortie-http.pid ]; then kill "$(cat /tmp/sortie-http.pid)" || true; fi
