name: Fix surface target hex markers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-fix-surface-hex.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-fix-surface-hex
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make land targets and ship hulls hexagonal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')

          old = '        marker.classList.toggle("ground", Boolean(enemy.ground));\n'
          new = '''        // AC-style surface target frame: land units and ship hulls are hexagons.\n        // Ship subsystems stay square display-only contacts, as requested.\n        marker.classList.toggle(\n          "ground",\n          Boolean(enemy.ground || (enemy.surface && !enemy.subsystem))\n        );\n'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'expected one ground marker toggle, found {count}')
          text = text.replace(old, new, 1)

          required = (
              'enemy.ground || (enemy.surface && !enemy.subsystem)',
              'enemy.alive && !enemy.subsystem',
              'if (!enemy || enemy.subsystem) return false;',
          )
          for needle in required:
              if needle not in text:
                  raise RuntimeError(f'missing expected source: {needle}')

          module = re.search(r'<script type="module">\n(?P<body>.*)\n  </script>', text, re.DOTALL)
          if not module:
              raise RuntimeError('could not extract index module')
          with tempfile.TemporaryDirectory() as temp_dir:
              module_path = Path(temp_dir) / 'index-module.mjs'
              module_path.write_text(module.group('body'), encoding='utf-8', newline='\n')
              subprocess.run(['node', '--check', str(module_path)], check=True)

          index_path.write_text(text, encoding='utf-8', newline='\n')

          css_path = Path('styles/hud-polish.css')
          css = css_path.read_text(encoding='utf-8')
          css_old = '''/* Ground contacts use the AC-style flat-top hexagonal target frame. */\n'''
          css_new = '''/* Surface targets use the AC-style flat-top hexagonal target frame. */\n'''
          if css_old not in css:
              raise RuntimeError('ground target CSS heading not found')
          css = css.replace(css_old, css_new, 1)

          comment_old = '''/* The HUD now uses this same marker node for normal, selected and locked\n   contacts, so this single override keeps the hexagon through every state.\n   Ships are surface targets but are not `ground`, and therefore stay square. */'''
          comment_new = '''/* The HUD uses this same marker node for normal, selected and locked\n   contacts, so the hexagon persists through every state. JS applies this class\n   to land targets and ship hulls; ship subsystems deliberately remain square. */'''
          if comment_old not in css:
              raise RuntimeError('old ship-square CSS comment not found')
          css = css.replace(comment_old, comment_new, 1)
          css_path.write_text(css, encoding='utf-8', newline='\n')

          print('surface target hex marker fix applied')
          PY

      - name: Static checks
        run: git diff --check

      - name: Remove integration workflow
        run: git rm .github/workflows/chatgpt-fix-surface-hex.yml

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html styles/hud-polish.css
          git commit -m 'Render ship hull targets as hexagons'
          git push origin HEAD:main
