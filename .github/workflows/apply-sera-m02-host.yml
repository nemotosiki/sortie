name: Apply Sera M02 host contracts

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/apply_sera_m02_host.py
      - tools/diagnose_sera_m02_boot.mjs
      - .github/workflows/apply-sera-m02-host.yml

permissions:
  contents: write

concurrency:
  group: apply-sera-m02-host
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Apply M02 host contracts
        run: |
          python -m py_compile tools/apply_sera_m02_host.py
          python tools/apply_sera_m02_host.py

      - name: Run M02 and shared static contracts
        run: |
          node tools/check_sera_m02_host.mjs
          node tools/check_map_amal_plain.mjs
          node tools/check_sera_m02_payload.mjs
          node tools/check_sera_m01_payload.mjs
          node tools/check_map_ren_bay.mjs
          node tools/check_air_iff_foundation.mjs
          node tools/check_legacy_airframe_variants.mjs
          node tools/check_fa18f_spw_select.mjs
          node tools/check_multirole_mobility_balance.mjs
          node --check tools/check_sera_m01_e2e.mjs
          node --check tools/diagnose_sera_m02_boot.mjs
          git diff --check

      - name: Install Chromium harness
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Diagnose M02 payload boot
        run: node tools/diagnose_sera_m02_boot.mjs

      - name: Run registry and M01 regression gates
        shell: bash
        run: |
          chrome_path=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          SORTIE_PLAYWRIGHT=playwright SORTIE_CHROME="$chrome_path" node tools/registry_gate.mjs
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/sortie-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html > /dev/null; then break; fi
            sleep 1
          done
          node tools/check_sera_m01_e2e.mjs

      - name: Commit verified M02 host contracts
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html tools/check_sera_m02_host.mjs
          git diff --cached --check
          git commit -m 'Implement Sera M02 host contracts'
          git push origin HEAD:chatgpt/sera-act1-implementation
