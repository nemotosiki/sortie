name: Add retreat outro and intercepted debrief

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".outro-ready"

permissions:
  contents: write

jobs:
  patch-static-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply outro feature, validate, clean up, and publish
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 -m py_compile .outro-feature/apply.py
          python3 .outro-feature/apply.py
          node --check /tmp/sortie-game.mjs
          git diff --check

          rm -rf .outro-feature
          rm -f .github/workflows/add-retreat-outro-debrief.yml

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines())
          expected = {
              "index.html",
              ".outro-feature/apply.py",
              ".github/workflows/add-retreat-outro-debrief.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected staged files: {sorted(changed)}")
          PY

          git commit -m "Add retreat outro and intercepted debrief"
          git push origin HEAD:main
