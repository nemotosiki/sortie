name: Apply F-15C airframe

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/apply_f15c_airframe.py
      - .github/workflows/apply-f15c-airframe.yml

permissions:
  contents: write

concurrency:
  group: apply-f15c-airframe
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Add F-15C
        run: python tools/apply_f15c_airframe.py

      - name: Check patch
        run: |
          git diff --check
          grep -q 'F-15C EAGLE' index.html
          grep -q '"f15c", "f15"' index.html

      - name: Commit F-15C
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html
          git rm tools/apply_f15c_airframe.py .github/workflows/apply-f15c-airframe.yml
          git commit -m 'Add F-15C air superiority variant'
          git push origin HEAD:chatgpt/sera-act1-implementation
