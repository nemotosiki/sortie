name: Apply F-15E identity integration

on:
  push:
    branches:
      - chatgpt/sera-act1-implementation
    paths:
      - tools/apply_f15e_identity.py
      - .github/workflows/apply-f15e-identity.yml

permissions:
  contents: write

concurrency:
  group: apply-f15e-identity
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/sera-act1-implementation
          fetch-depth: 0

      - name: Apply F-15E conversion
        run: python tools/apply_f15e_identity.py

      - name: Check patch
        run: |
          git diff --check
          grep -q 'F-15E STRIKE EAGLE' index.html
          grep -q 'theme.variant === "strikeeagle"' index.html

      - name: Commit F-15E conversion
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html
          git rm tools/apply_f15e_identity.py .github/workflows/apply-f15e-identity.yml
          git commit -m 'Convert the legacy F-15 slot to F-15E'
          git push origin HEAD:chatgpt/sera-act1-implementation
